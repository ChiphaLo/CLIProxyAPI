<style>/* CPA Console - Visual System R2
   Apple Web House Style v2 (Web house-style defaults, not official Apple values)
   Layers: primitive tokens -> semantic tokens -> component -> page pattern */

/* ---------------------------------------------------------------- tokens */
:root{
  color-scheme: light dark;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;

  --canvas:#F6F6F8;
  --surface:#FFFFFF;
  --surface-subtle:#EFEFF2;
  --surface-hover:#F2F2F5;
  --surface-sunken:#F6F6F8;

  --text:#1C1C1E;
  --text-secondary:#67676C;
  --text-tertiary:#8A8A90;
  --text2:var(--text-secondary);
  --text3:var(--text-tertiary);

  --separator:rgba(60,60,67,.16);
  --separator-strong:rgba(60,60,67,.28);
  --sep:var(--separator);
  --card:#FFFFFF;
  --card-strong:#FFFFFF;

  --accent:#0A73E8;
  --accent-hover:#0968D1;
  --accent-tint:rgba(10,115,232,.10);
  --accent-tint-strong:rgba(10,115,232,.16);
  --success:#248A3D;
  --success-tint:rgba(36,138,61,.12);
  --warning:#B87503;
  --warning-tint:rgba(184,117,3,.13);
  --danger:#D83B3E;
  --danger-tint:rgba(216,59,62,.12);
  --focus:#0A73E8;

  --series-input:#2F6FEB;
  --series-output:#1F7A3D;
  --series-cached:#7B4BE0;
  --series-write:#B87503;
  --series-cost:#C0393C;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-7:32px; --space-8:40px; --space-9:48px;

  --radius-xs:6px; --radius-sm:10px; --radius-md:12px; --radius-lg:16px;
  --ctl-h:36px; --ctl-h-sm:32px; --row-h:48px;
  --sidebar-width:236px; --toolbar-height:56px;
  --shadow-1:0 1px 2px rgba(16,17,20,.06);
  --shadow-2:0 20px 48px rgba(16,17,20,.18), 0 2px 8px rgba(16,17,20,.08);
  --ease:cubic-bezier(.32,.72,0,1);
}

@media (prefers-color-scheme: dark){
  :root{
    --canvas:#111113;
    --surface:#1B1B1E;
    --surface-subtle:#252529;
    --surface-hover:#232327;
    --surface-sunken:#202024;
    --text:#F5F5F7;
    --text-secondary:#B5B5BB;
    --text-tertiary:#8E8E95;
    --separator:rgba(235,235,245,.14);
    --separator-strong:rgba(235,235,245,.26);
    --card:#1B1B1E;
    --card-strong:#2B2B2F;
    --accent:#4C9CFF;
    --accent-hover:#6BAEFF;
    --accent-tint:rgba(76,156,255,.14);
    --accent-tint-strong:rgba(76,156,255,.22);
    --success:#45B75F;
    --success-tint:rgba(69,183,95,.16);
    --warning:#E3A72F;
    --warning-tint:rgba(227,167,47,.16);
    --danger:#FF696B;
    --danger-tint:rgba(255,105,107,.16);
    --focus:#4C9CFF;
    --series-input:#6EA8FF;
    --series-output:#4FBF6C;
    --series-cached:#B596FF;
    --series-write:#E3A72F;
    --series-cost:#FF8B8D;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 24px 56px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  }
}

/* ------------------------------------------------------------------ base */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--canvas);
  color:var(--text);
  font:400 14px/1.45 var(--font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4,p,dl,dd,figure{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--mono)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--accent-tint-strong)}

.grow{flex:1 1 auto;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--text-secondary)}
.mono{font-family:var(--mono);font-size:12.5px}
.divider{height:1px;background:var(--separator);margin:var(--space-5) 0}
.empty{padding:16px 4px;font-size:13px;color:var(--text-secondary)}

/* ------------------------------------------------------------- primitives */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:var(--ctl-h);padding:0 14px;
  border:1px solid transparent;border-radius:var(--radius-sm);
  font-size:13.5px;font-weight:500;white-space:nowrap;
  transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);
}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:active{background:var(--accent-hover)}
.btn-secondary{background:var(--surface);border-color:var(--separator-strong);color:var(--text)}
.btn-secondary:hover{background:var(--surface-hover)}
.btn-sm{height:var(--ctl-h-sm);padding:0 12px;font-size:13px}
.btn-sm svg{width:15px;height:15px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{
  display:grid;place-items:center;width:28px;height:28px;flex:none;
  border:1px solid transparent;border-radius:8px;color:var(--text-tertiary);
  transition:background .12s var(--ease),color .12s var(--ease);
}
.icon-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{background:var(--surface-subtle);color:var(--text)}
.icon-btn.danger:hover{background:var(--danger-tint);color:var(--danger)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.form-label{font-size:12.5px;font-weight:500;color:var(--text-secondary)}
.form-input{
  width:100%;min-width:0;height:var(--ctl-h);padding:0 10px;
  border:1px solid var(--separator-strong);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);font-size:13.5px;
  transition:border-color .12s var(--ease),box-shadow .12s var(--ease);
}
.form-input:hover{border-color:var(--text-tertiary)}
.form-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.form-input[disabled]{background:var(--surface-subtle);color:var(--text-tertiary)}
select.form-input{
  appearance:none;-webkit-appearance:none;padding-right:30px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M4 6.5 8 10.5 12 6.5' fill='none' stroke='%238A8A90' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;background-size:15px 15px;
}
input[type="number"].form-input,input[type="number"].form-input{font-variant-numeric:tabular-nums}
.err{font-size:12.5px;color:var(--danger)}
.err:empty{display:none}

.switch{
  position:relative;flex:none;width:38px;height:22px;border-radius:999px;
  background:var(--separator-strong);transition:background .15s var(--ease);
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.28);transition:transform .15s var(--ease);
}
.switch:hover{background:var(--text-tertiary)}
.switch.on:hover{background:var(--accent-hover)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(16px)}

.pill,.badge{
  display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;
  border:1px solid var(--separator);border-radius:var(--radius-xs);
  background:var(--surface-subtle);color:var(--text-secondary);
  font-size:12px;font-weight:500;white-space:nowrap;
}
.pill.ok,.badge.ok{background:var(--success-tint);border-color:transparent;color:var(--success)}
.pill.warn,.badge.warn{background:var(--warning-tint);border-color:transparent;color:var(--warning)}
.pill.bad,.badge.bad{background:var(--danger-tint);border-color:transparent;color:var(--danger)}
.pill.plain,.badge.plain{background:var(--surface-subtle);color:var(--text-secondary)}

.state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-secondary);white-space:nowrap}
.dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--text-tertiary)}
.dot.on,.dot.ok{background:var(--success)}
.dot.bad{background:var(--danger)}
.dot.warn{background:var(--warning)}
.status-dot{display:inline-block;width:7px;height:7px;flex:none;border-radius:50%;background:var(--text-tertiary)}
.status-dot.on{background:var(--success)}

/* ------------------------------------------------------------------ shell */
#app{display:none}
#app.on{display:grid;grid-template-columns:var(--sidebar-width) minmax(0,1fr);align-items:start}

.sidebar{
  position:sticky;top:0;display:flex;flex-direction:column;
  height:100vh;padding:var(--space-4) var(--space-3) var(--space-3);
  background:var(--canvas);border-right:1px solid var(--separator);
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px var(--space-5)}
.brand-mark{
  display:grid;place-items:center;width:26px;height:26px;flex:none;
  border:1px solid var(--accent-tint-strong);border-radius:8px;
  background:var(--accent-tint);color:var(--accent);
  font-size:9.5px;font-weight:700;letter-spacing:.02em;
}
.brand-copy{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand-copy span{font-size:13.5px;font-weight:600}
.brand-copy small{font-size:11.5px;color:var(--text-tertiary)}
.sidebar-label{
  padding:0 10px var(--space-2);
  font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--text-tertiary);
}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:9px;
  height:34px;padding:0 10px;
  border:1px solid transparent;border-radius:9px;
  color:var(--text-secondary);font-size:13.5px;
  transition:background .12s var(--ease),color .12s var(--ease),border-color .12s var(--ease);
}
.nav-icon{display:grid;place-items:center;width:17px;height:17px;flex:none;color:var(--text-tertiary)}
.nav-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item:hover{background:var(--surface-hover);color:var(--text)}
.nav-item:hover .nav-icon{color:var(--text-secondary)}
.nav-item.on{
  background:var(--surface);border-color:var(--separator);
  color:var(--text);font-weight:600;box-shadow:var(--shadow-1);
}
.nav-item.on .nav-icon{color:var(--accent)}
.sidebar-foot{
  margin-top:auto;display:flex;flex-direction:column;gap:5px;
  padding:var(--space-3) 10px 2px;border-top:1px solid var(--separator);
}
.endpoint-row{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-secondary)}
.endpoint-meta{font-size:11.5px;color:var(--text-tertiary)}

.workspace{display:flex;flex-direction:column;min-width:0;min-height:100vh;background:var(--surface)}
.page-head{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:var(--space-4);
  min-height:var(--toolbar-height);padding:10px var(--space-7);
  background:var(--surface);border-bottom:1px solid var(--separator);
}
.page-head h1{font-size:18px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.page-sub{font-size:12.5px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-head-actions{display:flex;align-items:center;gap:var(--space-2);margin-left:auto}
#main{display:block;min-width:0}

/* ------------------------------------------------------------- page layout */
.page{padding:var(--space-6) var(--space-7) var(--space-8);display:flex;flex-direction:column}
.page-intro{display:flex;align-items:baseline;gap:10px;margin-bottom:var(--space-4)}
.page-intro h2{font-size:15px;font-weight:600}
.page-intro p{font-size:12.5px;color:var(--text-secondary)}
.section{display:flex;flex-direction:column;gap:var(--space-3)}
.section+.section{margin-top:var(--space-7)}
.section-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.section-head h2{font-size:15px;font-weight:600}
.section-head p{font-size:12.5px;color:var(--text-secondary)}
.section-head .pill,.section-head .badge{margin-left:auto}

.note{display:flex;align-items:flex-start;gap:8px;margin-top:var(--space-6);font-size:12.5px;line-height:1.5;color:var(--text-secondary)}
.note svg{width:15px;height:15px;flex:none;margin-top:1px;fill:none;stroke:var(--text-tertiary);stroke-width:1.6;stroke-linecap:round}
.notice{
  display:flex;gap:9px;align-items:flex-start;
  padding:11px 13px;margin-bottom:var(--space-4);
  border:1px solid var(--separator);border-left:3px solid var(--warning);border-radius:var(--radius-sm);
  background:var(--warning-tint);font-size:12.5px;line-height:1.5;
}

/* --------------------------------------------------------------- overview */
.page-overview{gap:var(--space-6)}
.overview-grid{display:grid;gap:var(--space-6) var(--space-7);grid-template-columns:minmax(0,1fr)}
@media (min-width:1180px){
  .overview-grid{grid-template-columns:minmax(0,1fr) 330px;align-items:start}
}
.panel{display:flex;flex-direction:column;gap:var(--space-3);min-width:0}
.panel-head{display:flex;align-items:baseline;gap:10px}
.panel-head h2{font-size:15px;font-weight:600}
.panel-head p{font-size:12.5px;color:var(--text-secondary)}
.panel-head .pill,.panel-head .badge{margin-left:auto}

.list{border:1px solid var(--separator);border-radius:var(--radius-md);background:var(--surface);overflow:hidden}
.list-row{
  display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;align-items:center;gap:var(--space-3);
  padding:11px var(--space-4);border-top:1px solid var(--separator);
}
.list-row:first-child{border-top:none}
.row-icon{display:grid;place-items:center;color:var(--text-tertiary)}
.row-icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.row-title{font-size:13.5px;font-weight:600;color:var(--text)}
.row-sub{font-size:12px;color:var(--text-secondary);overflow-wrap:anywhere}
.row-value{font-size:13px;font-variant-numeric:tabular-nums;color:var(--text);text-align:right}

.kv{display:flex;flex-direction:column}
.kv-row{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);padding:11px 0;border-top:1px solid var(--separator)}
.kv-row:first-child{border-top:none;padding-top:2px}
.kv-label{font-size:13px;color:var(--text-secondary)}
.kv-value{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------------------------------------------------------------- datagrid */
.datagrid{border:1px solid var(--separator);border-radius:var(--radius-md);background:var(--surface);overflow:hidden}
.datagrid-head,.datagrid-row{display:grid;align-items:center;gap:var(--space-4);padding:0 var(--space-4)}
.datagrid-head{
  height:34px;background:var(--surface-sunken);border-bottom:1px solid var(--separator);
  font-size:12px;font-weight:600;color:var(--text-secondary);white-space:nowrap;
}
.datagrid-row{
  width:100%;min-height:var(--row-h);padding-top:10px;padding-bottom:10px;
  border-top:1px solid var(--separator);text-align:left;
  transition:background .12s var(--ease);
}
.datagrid-row:first-child{border-top:none}
.datagrid-row:hover{background:var(--surface-hover)}
.subs-cols{grid-template-columns:minmax(200px,1.6fr) 110px 140px 124px 20px}
.key-cols{grid-template-columns:minmax(180px,1.4fr) minmax(150px,1fr) 120px 56px 32px}
.cell{font-size:13px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:16px;height:16px;fill:none;stroke:var(--text-tertiary);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kmask{font-family:var(--mono);font-size:12.5px;color:var(--text-secondary);overflow-wrap:anywhere}

/* ------------------------------------------------------------------- usage */
.toolbar{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--space-4);
  padding-bottom:var(--space-4);border-bottom:1px solid var(--separator);
}
.toolbar .field{flex:0 0 auto;min-width:150px}
.toolbar .toolbar-action{margin-left:auto;display:flex;align-items:center;gap:10px}
.usage-custom{display:grid;grid-template-columns:repeat(2,minmax(0,240px));gap:var(--space-4);padding:var(--space-4) 0 var(--space-2)}
.filter-summary{margin-top:var(--space-3);font-size:12.5px;color:var(--text-secondary)}

.stat-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-5) var(--space-6);padding-top:var(--space-5);margin-bottom:var(--space-6)}
.stat{display:flex;flex-direction:column;gap:3px;min-width:0}
.stat-label{font-size:12.5px;color:var(--text-secondary)}
.stat-value{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.stat-sub{font-size:12px;color:var(--text-tertiary)}

.cbar{display:flex;gap:2px;height:10px;border-radius:6px;overflow:hidden;background:var(--surface-subtle)}
.cbar span{display:block;min-width:2px}
.cbar-legend{display:flex;flex-wrap:wrap;gap:var(--space-5);margin-top:var(--space-3);font-size:12.5px;color:var(--text-secondary)}
.cbar-legend em{display:inline-flex;align-items:center;gap:7px;font-style:normal}
.cbar-legend i{width:8px;height:8px;border-radius:2px;flex:none}
.cbar-legend b{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}

.chart-panel{border:1px solid var(--separator);border-radius:var(--radius-md);background:var(--surface);padding:var(--space-4) var(--space-3) var(--space-2)}
.trend-wrap{position:relative}
.trend-legend{display:flex;flex-wrap:wrap;gap:var(--space-4);padding:var(--space-3) 6px 2px;font-size:12px;color:var(--text-secondary)}
.trend-legend span{display:inline-flex;align-items:center;gap:7px}
.legend-line{display:inline-block;width:18px;height:0;border-top:2px solid var(--series,var(--separator-strong))}
.legend-line.dash{border-top-style:dashed}
.trend-tip{
  position:absolute;z-index:5;min-width:180px;pointer-events:none;
  padding:9px 11px;background:var(--card);border:1px solid var(--separator);border-radius:var(--radius-sm);box-shadow:var(--shadow-2);
  font-size:12px;color:var(--text-secondary);
}
.tt-title{font-weight:600;color:var(--text);margin-bottom:5px}
.tt-row{display:flex;align-items:center;gap:7px}
.tt-row b{margin-left:auto;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.tt-dot{width:7px;height:7px;border-radius:2px;flex:none;display:inline-block}
.tt-sub{margin-top:5px;color:var(--text-tertiary)}

.table-wrap{border:1px solid var(--separator);border-radius:var(--radius-md);background:var(--surface);overflow:auto}
.table-wrap.scroll{max-height:min(64vh,620px)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{
  position:sticky;top:0;z-index:1;
  padding:9px var(--space-4);text-align:left;white-space:nowrap;
  background:var(--surface-sunken);border-bottom:1px solid var(--separator);
  font-size:12px;font-weight:600;color:var(--text-secondary);
}
.tbl td{padding:9px var(--space-4);border-bottom:1px solid var(--separator);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:var(--surface-hover)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.model-req{font-family:var(--mono);font-size:12.5px;color:var(--text)}
.model-sub{font-family:var(--mono);font-size:11.5px;color:var(--text-tertiary);margin-top:2px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.model-sub.mismatch{color:var(--warning)}
.model-mismatch-tag{
  display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;
  background:var(--warning-tint);color:var(--warning);font-size:11px;font-weight:600;font-family:var(--font);
}

/* ------------------------------------------------------------------ login */
#login{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:var(--space-6);background:var(--canvas)}
#login.done{display:none}
.login-card{
  width:min(400px,100%);padding:var(--space-7);
  background:var(--surface);border:1px solid var(--separator);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-1);
}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:var(--space-6)}
.login-mark{
  display:grid;place-items:center;width:28px;height:28px;
  border:1px solid var(--accent-tint-strong);border-radius:9px;background:var(--accent-tint);
  color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.02em;
}
.login-brand span:last-child{font-size:13.5px;font-weight:600}
.login-card h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.login-sub{margin:6px 0 var(--space-6);font-size:13px;color:var(--text-secondary)}
.login-card form{display:flex;flex-direction:column;gap:var(--space-4)}
.login-foot{display:flex;align-items:center;gap:7px;margin-top:var(--space-6);font-size:12px;color:var(--text-tertiary)}

/* ------------------------------------------------------------ dialogs/sheet */
.sheet-back{
  position:fixed;inset:0;z-index:60;background:rgba(16,17,20,.32);
  opacity:0;pointer-events:none;transition:opacity .16s var(--ease);
}
.sheet-back.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:70;top:50%;left:50%;
  width:min(520px,calc(100vw - 32px));max-height:min(86vh,880px);overflow:auto;
  padding:var(--space-5);
  background:var(--surface);border:1px solid var(--separator);border-radius:var(--radius-lg);box-shadow:var(--shadow-2);
  opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-46%);
  transition:opacity .18s var(--ease),transform .18s var(--ease);
}
.sheet.on{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%)}
.sheet:focus{outline:none}
.sheet.wide{width:min(1060px,calc(100vw - 32px))}
.sheet h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.sheet .foot{display:flex;justify-content:flex-end;gap:var(--space-2);margin-top:var(--space-5);padding-top:var(--space-4);border-top:1px solid var(--separator)}
.sheet .field+.field{margin-top:var(--space-4)}

.provider-editor{display:flex;flex-direction:column;min-width:0}
.provider-editor-head{display:flex;align-items:center;gap:var(--space-3);padding-bottom:var(--space-4);border-bottom:1px solid var(--separator)}
.provider-editor-head h3{font-size:15px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4);padding:var(--space-4) 0}
.form-grid .field{grid-column:auto}
.provider-actions{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-3)}
.form-grid .wide{grid-column:1/-1}
.codex-model-list{margin-top:var(--space-3);border:1px solid var(--separator);border-radius:var(--radius-md);padding:0 var(--space-3)}
.row>.field{flex:1 1 0;min-width:0}
.hint{font-size:12.5px;color:var(--text-secondary);margin:-2px 0 var(--space-4)}
.sheet h3.subhead{font-size:13.5px;font-weight:600}
.mapping-head,.mapping-row{display:grid;grid-template-columns:minmax(160px,1.35fr) minmax(160px,1.35fr) 104px 168px 48px 32px;gap:10px;align-items:center}
.mapping-head{padding-bottom:8px;border-bottom:1px solid var(--separator);font-size:12px;font-weight:600;color:var(--text-secondary)}
.mapping-row{padding:8px 0;border-bottom:1px solid var(--separator)}
.mapping-row:last-child{border-bottom:none}
.mapping-row input,.mapping-row select{
  width:100%;min-width:0;height:34px;padding:0 9px;
  border:1px solid var(--separator-strong);border-radius:8px;background:var(--surface);
  font-size:12.5px;font-family:var(--mono);
}
.mapping-row select{font-family:var(--font)}
.mapping-row input:focus,.mapping-row select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.mapping-row .switch{justify-self:center}
.model-list{display:block}
.price-editor{margin-top:var(--space-3)}
.price-head,.price-row{display:grid;grid-template-columns:minmax(180px,1.6fr) repeat(4,minmax(0,150px));gap:10px;align-items:center}
.price-head{padding-bottom:8px;border-bottom:1px solid var(--separator);font-size:12px;font-weight:600;color:var(--text-secondary)}
.price-row{padding:8px 0;border-bottom:1px solid var(--separator);font-size:12.5px}
.price-row:last-child{border-bottom:none}
.price-row input{
  width:100%;min-width:0;height:34px;padding:0 9px;
  border:1px solid var(--separator-strong);border-radius:8px;background:var(--surface);
  font-size:12.5px;font-variant-numeric:tabular-nums;
}
.price-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}

.codex-model-list{display:block}
.codex-model-row{display:grid;grid-template-columns:minmax(0,1.5fr) 110px minmax(0,1fr);gap:var(--space-3);align-items:center;padding:9px 0;border-bottom:1px solid var(--separator);font-size:13px}
.codex-model-row:last-child{border-bottom:none}
.codex-model-row.muted{font-size:12px;font-weight:600;color:var(--text-secondary)}
.reasoning-badges{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.reasoning-badge{
  display:inline-flex;align-items:center;height:20px;padding:0 6px;
  border:1px solid var(--separator);border-radius:var(--radius-xs);background:var(--surface-subtle);
  font-family:var(--mono);font-size:11px;color:var(--text-secondary);
}

.steps{display:flex;flex-direction:column;gap:9px;margin-top:var(--space-4);font-size:13.5px;color:var(--text-secondary)}
.steps li{display:flex;align-items:center;gap:9px}
.steps li.done{color:var(--text)}
.steps li.bad{color:var(--danger)}
.spinner{
  display:inline-block;width:13px;height:13px;flex:none;border-radius:50%;
  border:2px solid var(--separator-strong);border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.key-reveal{
  display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-4);padding:11px 13px;
  border:1px solid var(--separator);border-radius:var(--radius-sm);background:var(--surface-subtle);
}
.key-reveal code{flex:1 1 auto;min-width:0;font-size:12.5px;overflow-wrap:anywhere}

#toasts{position:fixed;z-index:90;left:50%;bottom:var(--space-6);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{
  padding:8px 14px;border-radius:var(--radius-sm);
  background:rgba(28,28,30,.94);color:#fff;font-size:13px;box-shadow:var(--shadow-2);
}
.toast.err{background:var(--danger);color:#fff}
@media (prefers-color-scheme: dark){
  .toast{background:var(--surface-subtle);color:var(--text);border:1px solid var(--separator)}
  .toast.err{background:var(--danger-tint);color:var(--danger);border-color:transparent}
}

/* -------------------------------------------------------------- responsive */
@media (max-width:1080px){
  :root{--sidebar-width:210px}
  .page{padding:var(--space-6) var(--space-6) var(--space-8)}
  .page-head{padding:10px var(--space-6)}
  .stat-strip{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:860px){
  #app.on{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:static;height:auto;flex-direction:row;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-right:none;border-bottom:1px solid var(--separator);overflow-x:auto}
  .brand{padding:0 var(--space-3) 0 0}
  .brand-copy,.brand-copy span{white-space:nowrap}
  .brand-copy small,.sidebar-label,.sidebar-foot{display:none}
  .nav-list{flex-direction:row;gap:var(--space-2)}
  .nav-item{height:32px;white-space:nowrap}
  .page-head{flex-wrap:wrap;gap:var(--space-3);min-height:0;padding:var(--space-3) var(--space-4)}
  .page-sub{display:none}
  .page-head-actions{margin-left:0}
  .page{padding:var(--space-5) var(--space-4) var(--space-8)}
  .stat-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .mapping-head{display:none}
  .mapping-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-rows:auto}
  .price-head{display:none}
  .price-row{grid-template-columns:minmax(0,1fr) repeat(4,minmax(0,1fr))}
  .datagrid-head{display:none}
  .subs-cols,.key-cols{grid-template-columns:minmax(0,1fr) auto;row-gap:8px;padding-top:var(--space-3);padding-bottom:var(--space-3)}
  .subs-cols .row-main,.key-cols .row-main{grid-column:1/2;grid-row:1}
  .subs-cols .state,.key-cols .state{grid-column:2/3;grid-row:1;justify-self:end}
  .subs-cols .cell,.key-cols .kmask{grid-column:1/-1}
  .subs-cols .chev{display:none}
  .key-cols .switch{grid-column:2/3;justify-self:end}
  .key-cols .icon-btn{grid-column:2/3;justify-self:end}
  .tbl th,.tbl td{padding:8px 12px}
}
@media (max-width:560px){
  .table-wrap{border-radius:var(--radius-sm)}
  .list-row{grid-template-columns:18px minmax(0,1fr);grid-auto-rows:auto}
  .list-row .row-value,.list-row .state{grid-column:2/3;justify-self:start}
  .stat-strip{grid-template-columns:minmax(0,1fr)}
  .sidebar{flex-wrap:wrap;row-gap:var(--space-2)}
  .brand{width:100%;padding:0}
  .nav-list{width:100%;overflow-x:auto;padding-bottom:2px}
  .page-head h1{font-size:16px}
}

/* ------------------------------------------------------------ preferences */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}
@media (prefers-contrast: more){
  :root{--separator:rgba(60,60,67,.36);--separator-strong:rgba(60,60,67,.5);--text-secondary:#4A4A4F;--text-tertiary:#5C5C61}
}
@media (forced-colors: active){
  .btn,.form-input,.switch,.list,.datagrid,.chart-panel,.table-wrap,.sheet{border-color:CanvasText}
  .nav-item.on{border-color:Highlight}
}


/*
 * CPA Control Center — local visual rewrite, 2026-09-20
 * Target: calm / precise / compact / technical / trustworthy.
 *
 * This layer deliberately changes the application shell, page hierarchy,
 * grouped surfaces, auth screen, quota presentation and responsive behavior.
 * Product behavior, API calls, identifiers and event hooks stay in the source
 * document below this visual system.
 */

:root{
  color-scheme:light dark;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"SFMono-Regular","Cascadia Code","Segoe UI Mono",ui-monospace,Menlo,Consolas,monospace;

  --canvas:#f4f5f7;
  --surface:#ffffff;
  --surface-subtle:#f7f7f9;
  --surface-hover:#f1f2f4;
  --surface-sunken:#eceef1;
  --surface-elevated:#ffffff;
  --chrome:rgba(249,249,251,.88);

  --text:#1d1d1f;
  --text-secondary:#606066;
  --text-tertiary:#85858c;
  --text2:var(--text-secondary);
  --text3:var(--text-tertiary);

  --separator:rgba(60,60,67,.14);
  --separator-strong:rgba(60,60,67,.24);
  --sep:var(--separator);
  --border:var(--separator);
  --card:var(--surface-elevated);
  --card-strong:var(--surface-elevated);

  --accent:#0878e8;
  --accent-hover:#0068d5;
  --accent-tint:rgba(8,120,232,.09);
  --accent-tint-strong:rgba(8,120,232,.16);
  --success:#21863a;
  --success-tint:rgba(33,134,58,.11);
  --warning:#a96900;
  --warning-tint:rgba(169,105,0,.12);
  --danger:#d13b40;
  --danger-tint:rgba(209,59,64,.11);
  --focus:#0878e8;

  --series-input:#2e70e8;
  --series-output:#21863a;
  --series-cached:#7654d8;
  --series-write:#b67400;
  --series-cost:#c93f48;

  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:20px;
  --space-6:24px;
  --space-7:32px;
  --space-8:40px;
  --space-9:48px;

  --radius-xs:6px;
  --radius-sm:9px;
  --radius-md:13px;
  --radius-lg:18px;
  --ctl-h:38px;
  --ctl-h-sm:32px;
  --row-h:54px;
  --appbar-h:68px;
  --measure:1480px;
  --measure-reading:1080px;
  --shadow-1:0 1px 2px rgba(16,17,20,.05);
  --shadow-2:0 24px 64px rgba(20,22,28,.18),0 4px 16px rgba(20,22,28,.08);
  --ease:cubic-bezier(.2,.72,.2,1);
}

@media (prefers-color-scheme:dark){
  :root{
    --canvas:#0f1012;
    --surface:#191a1d;
    --surface-subtle:#222327;
    --surface-hover:#27282d;
    --surface-sunken:#121315;
    --surface-elevated:#242529;
    --chrome:rgba(24,25,28,.88);
    --text:#f4f4f6;
    --text-secondary:#b7b7bd;
    --text-tertiary:#8d8d95;
    --separator:rgba(235,235,245,.13);
    --separator-strong:rgba(235,235,245,.22);
    --accent:#4da0ff;
    --accent-hover:#6aaeff;
    --accent-tint:rgba(77,160,255,.13);
    --accent-tint-strong:rgba(77,160,255,.22);
    --success:#48b861;
    --success-tint:rgba(72,184,97,.15);
    --warning:#e3a62d;
    --warning-tint:rgba(227,166,45,.15);
    --danger:#ff6c70;
    --danger-tint:rgba(255,108,112,.15);
    --focus:#4da0ff;
    --series-input:#72acff;
    --series-output:#55c46d;
    --series-cached:#b89cff;
    --series-write:#e3a62d;
    --series-cost:#ff9295;
    --shadow-1:0 1px 2px rgba(0,0,0,.32);
    --shadow-2:0 28px 72px rgba(0,0,0,.6),0 4px 16px rgba(0,0,0,.36);
  }
}

/* Foundation */
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
html{-webkit-text-size-adjust:100%;background:var(--canvas)}
body{
  margin:0;
  background:var(--canvas);
  color:var(--text);
  font:400 14px/1.5 var(--font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4,p,dl,dd,figure{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--accent-tint-strong)}
[hidden]{display:none!important}

.grow{flex:1 1 auto;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--text-secondary)}
.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.divider{height:1px;background:var(--separator);margin:24px 0}
.empty{padding:24px;font-size:13px;color:var(--text-secondary);text-align:center}

/* Controls */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:var(--ctl-h);padding:0 15px;
  border:1px solid transparent;border-radius:var(--radius-sm);
  font-size:13.5px;font-weight:550;white-space:nowrap;
  transition:background .14s var(--ease),border-color .14s var(--ease),color .14s var(--ease),transform .1s var(--ease),box-shadow .14s var(--ease);
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{color:#fff;background:var(--accent);box-shadow:0 1px 2px rgba(0,88,190,.18)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--surface);border-color:var(--separator-strong);color:var(--text);box-shadow:var(--shadow-1)}
.btn-secondary:hover{background:var(--surface-hover)}
.btn-sm{min-height:var(--ctl-h-sm);padding:0 12px;font-size:13px}
.btn-block{width:100%}
.btn:disabled{opacity:.48;transform:none}

.icon-btn{
  display:grid;place-items:center;width:32px;height:32px;flex:none;
  border:1px solid transparent;border-radius:var(--radius-sm);color:var(--text-tertiary);
  transition:background .14s var(--ease),color .14s var(--ease),border-color .14s var(--ease);
}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{background:var(--surface-hover);color:var(--text);border-color:var(--separator)}
.icon-btn.danger:hover{background:var(--danger-tint);color:var(--danger);border-color:transparent}

.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.form-label{font-size:12.5px;font-weight:560;color:var(--text-secondary)}
.form-input,input:not([type="checkbox"]):not([type="radio"]),select,textarea{
  width:100%;min-width:0;min-height:var(--ctl-h);padding:0 11px;
  border:1px solid var(--separator-strong);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);font-size:13.5px;
  transition:border-color .14s var(--ease),box-shadow .14s var(--ease),background .14s var(--ease);
}
textarea{padding-top:9px;padding-bottom:9px}
.form-input:hover,input:not([type="checkbox"]):not([type="radio"]):hover,select:hover,textarea:hover{border-color:var(--text-tertiary)}
.form-input:focus,input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.form-input[disabled]{background:var(--surface-subtle);color:var(--text-tertiary)}
select.form-input,select{
  appearance:none;-webkit-appearance:none;padding-right:32px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M4 6.25 8 10.25 12 6.25' fill='none' stroke='%2385858c' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:15px;
}
.err{font-size:12.5px;color:var(--danger)}
.err:empty{display:none}

.switch{position:relative;flex:none;width:40px;height:23px;border-radius:999px;background:var(--separator-strong);transition:background .15s var(--ease)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .15s var(--ease)}
.switch:hover{background:var(--text-tertiary)}
.switch.on{background:var(--accent)}
.switch.on:hover{background:var(--accent-hover)}
.switch.on::after{transform:translateX(17px)}

.pill,.badge{
  display:inline-flex;align-items:center;gap:5px;min-height:23px;padding:2px 8px;
  border:1px solid var(--separator);border-radius:var(--radius-xs);
  background:var(--surface-subtle);color:var(--text-secondary);
  font-size:11.5px;font-weight:560;line-height:1.25;white-space:nowrap;
}
.pill.ok,.badge.ok{background:var(--success-tint);border-color:transparent;color:var(--success)}
.pill.warn,.badge.warn{background:var(--warning-tint);border-color:transparent;color:var(--warning)}
.pill.bad,.badge.bad{background:var(--danger-tint);border-color:transparent;color:var(--danger)}
.pill.plain,.badge.plain{background:var(--surface-subtle);color:var(--text-secondary)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-secondary);white-space:nowrap}
.dot,.status-dot{display:inline-block;width:7px;height:7px;flex:none;border-radius:50%;background:var(--text-tertiary)}
.dot.on,.dot.ok,.status-dot.on{background:var(--success)}
.dot.bad{background:var(--danger)}
.dot.warn{background:var(--warning)}

/* Authentication: a two-column task-focused welcome screen. */
#login{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;
  padding:32px;background:var(--canvas);
}
#login.done{display:none}
.login-shell{
  width:min(920px,100%);min-height:520px;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);
  overflow:hidden;border:1px solid var(--separator);border-radius:22px;background:var(--surface);box-shadow:0 18px 56px rgba(20,22,28,.09);
}
.login-aside{
  display:flex;flex-direction:column;justify-content:space-between;gap:40px;
  padding:52px;background:var(--surface-subtle);border-right:1px solid var(--separator);
}
.login-aside .login-brand{margin:0}
.login-intro{max-width:430px}
.login-kicker{margin-bottom:12px;color:var(--accent);font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase}
.login-aside h1{font-size:34px;line-height:1.16;font-weight:650;letter-spacing:-.035em}
.login-aside p{margin-top:16px;color:var(--text-secondary);font-size:15px;line-height:1.65}
.login-facts{display:grid;gap:12px;color:var(--text-secondary);font-size:13px}
.login-facts span{display:flex;align-items:center;gap:9px}
.login-facts svg{width:16px;height:16px;fill:none;stroke:var(--text-tertiary);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.login-card{
  align-self:center;width:100%;min-height:0;padding:52px 48px;
  border:0;border-radius:0;background:var(--surface);box-shadow:none;
}
.login-card .login-brand{display:none}
.login-card h2{font-size:22px;font-weight:620;letter-spacing:-.018em}
.login-sub{margin:7px 0 28px;color:var(--text-secondary);font-size:13.5px}
.login-card .field{margin-bottom:14px}
.login-card .form-input,.login-card input{min-height:44px}
.login-card .btn{min-height:44px}
.login-brand{display:flex;align-items:center;gap:11px;font-size:14px;font-weight:620}
.login-mark,.brand-mark{
  display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:9px;
  background:var(--text);color:var(--surface);font-size:10px;font-weight:750;letter-spacing:.01em;text-transform:uppercase;
}
.login-foot{display:flex;align-items:center;gap:8px;margin-top:24px;padding-top:18px;border-top:1px solid var(--separator);font-size:12px;color:var(--text-tertiary)}

/* Global shell: top navigation replaces the previous left rail. */
#app{display:none}
#app.on{display:block;min-height:100vh}
.appbar,.sidebar{
  position:sticky;top:0;z-index:50;
  display:grid;grid-template-columns:auto minmax(260px,1fr) auto;align-items:center;gap:26px;
  min-height:var(--appbar-h);padding:10px max(24px,calc((100vw - var(--measure))/2 + 28px));
  border-right:0;border-bottom:1px solid var(--separator);
  background:var(--chrome);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
}
.brand{display:flex;align-items:center;gap:10px;padding:0}
.brand-copy{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.brand-copy span{font-size:13.5px;font-weight:630;white-space:nowrap}
.brand-copy small{font-size:11px;color:var(--text-tertiary);white-space:nowrap}
.sidebar-label{display:none}
.nav-list{justify-self:center;display:flex;flex-direction:row;align-items:center;gap:3px;padding:3px;border:1px solid var(--separator);border-radius:12px;background:var(--surface-subtle)}
.nav-item{
  display:flex;align-items:center;justify-content:center;gap:7px;min-width:96px;height:34px;padding:0 12px;
  border:1px solid transparent;border-radius:9px;color:var(--text-secondary);font-size:13px;font-weight:520;
  transition:background .14s var(--ease),color .14s var(--ease),border-color .14s var(--ease),box-shadow .14s var(--ease);
}
.nav-item:hover{color:var(--text);background:var(--surface-hover)}
.nav-item.on{color:var(--text);font-weight:620;background:var(--surface);border-color:var(--separator);box-shadow:var(--shadow-1)}
.nav-icon{display:grid;place-items:center;width:16px;height:16px;color:var(--text-tertiary)}
.nav-item.on .nav-icon{color:var(--accent)}
.nav-icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-label{white-space:nowrap}
.sidebar-foot{display:flex;align-items:flex-end;gap:4px;flex-direction:column;margin:0;padding:0;border:0}
.endpoint-row{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-secondary)}
.endpoint-meta{font-size:11px;color:var(--text-tertiary)}

.workspace{min-width:0;min-height:calc(100vh - var(--appbar-h));background:var(--canvas)}
.page-head{
  position:relative;top:auto;z-index:1;
  display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:end;gap:12px 16px;
  width:min(100%,var(--measure));min-height:0;margin:0 auto;padding:34px 32px 20px;
  background:transparent;border:0;
}
.page-head h1{grid-column:1;font-size:28px;line-height:1.2;font-weight:650;letter-spacing:-.028em;white-space:normal}
.page-sub{grid-column:1;margin-top:-4px;font-size:13.5px;line-height:1.5;color:var(--text-secondary);white-space:normal;overflow:visible}
.page-head-actions{grid-column:2;grid-row:1/3;align-self:center;display:flex;align-items:center;gap:8px;margin:0}
#applyBtn{grid-column:3;grid-row:1/3;align-self:center}
#main{display:block;min-width:0}

/* Page system */
.page{width:min(100%,var(--measure));margin:0 auto;padding:0 32px 64px;display:flex;flex-direction:column}
.section{display:flex;flex-direction:column;gap:14px}
.section+.section{margin-top:34px}
.section-head,.panel-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.section-head h2,.panel-head h2{font-size:16px;font-weight:620;letter-spacing:-.006em}
.section-head p,.panel-head p{font-size:12.5px;color:var(--text-secondary)}
.section-head .pill,.section-head .badge,.panel-head .pill,.panel-head .badge{margin-left:auto}
.note{display:flex;align-items:flex-start;gap:9px;margin-top:20px;padding:14px 16px;border-radius:var(--radius-md);background:var(--surface-subtle);font-size:12.5px;line-height:1.55;color:var(--text-secondary)}
.note svg{width:16px;height:16px;flex:none;margin-top:1px;fill:none;stroke:var(--text-tertiary);stroke-width:1.7;stroke-linecap:round}
.notice{display:flex;gap:9px;align-items:flex-start;padding:12px 14px;margin-bottom:4px;border:1px solid var(--separator);border-left:3px solid var(--warning);border-radius:var(--radius-md);background:var(--warning-tint);font-size:12.5px;line-height:1.55}

/* Overview: one grouped status matrix + one compact activity summary. */
.page-overview{gap:0}
.overview-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;align-items:start;gap:24px}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.list,.kv,.datagrid,.table-wrap,.chart-panel,#oauthAccountsPanel>.oauth-panel,#quotaModelPanel>.oauth-panel{
  border:1px solid var(--separator);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-1);
}
.page-overview .list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:hidden}
.page-overview .list-row{
  display:grid;grid-template-columns:28px minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center;gap:4px 10px;
  min-height:104px;padding:16px;border-top:0;border-left:1px solid var(--separator);border-bottom:1px solid var(--separator);
}
.page-overview .list-row:nth-child(3n+1){border-left:0}
.page-overview .list-row:nth-last-child(-n+3){border-bottom:0}
.row-icon{display:grid;place-items:center;color:var(--text-tertiary)}
.row-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.row-title{font-size:13.5px;font-weight:620;color:var(--text)}
.row-sub{font-size:11.5px;color:var(--text-tertiary);overflow-wrap:anywhere}
.row-value{grid-column:2;font-size:15px;font-weight:620;font-variant-numeric:tabular-nums;color:var(--text);text-align:left}
.page-overview .list-row>.state{grid-column:3;grid-row:2}
.page-overview .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:hidden}
.page-overview .kv-row{display:flex;flex-direction:column;gap:5px;min-height:104px;padding:18px;border-top:0;border-left:1px solid var(--separator);border-bottom:1px solid var(--separator)}
.page-overview .kv-row:nth-child(odd){border-left:0}
.page-overview .kv-row:nth-last-child(-n+2){border-bottom:0}
.kv-label{font-size:12px;color:var(--text-secondary)}
.kv-value{font-size:24px;line-height:1.15;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.025em}

/* Data management */
.datagrid{overflow:hidden}
.datagrid-head,.datagrid-row{display:grid;align-items:center;gap:16px;padding:0 18px}
.datagrid-head{height:38px;background:var(--surface-subtle);border-bottom:1px solid var(--separator);font-size:11.5px;font-weight:620;color:var(--text-tertiary);white-space:nowrap;text-transform:none}
.datagrid-row{width:100%;min-height:var(--row-h);padding-top:11px;padding-bottom:11px;border-top:1px solid var(--separator);text-align:left;transition:background .13s var(--ease)}
.datagrid-row:first-child{border-top:0}
.datagrid-row:hover{background:var(--surface-hover)}
.subs-cols{grid-template-columns:minmax(230px,1.6fr) 110px 140px 120px 18px}
.key-cols{grid-template-columns:minmax(190px,1.35fr) minmax(170px,1fr) 120px 60px 32px}
.cell{font-size:12.5px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:16px;height:16px;fill:none;stroke:var(--text-tertiary);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kmask{font-family:var(--mono);font-size:12px;color:var(--text-secondary);overflow-wrap:anywhere}

/* OAuth quota is a first-class grouped data surface, not a stack of inline cards. */
#oauthAccountsPanel{margin-top:24px}
.oauth-panel{overflow:hidden}
.oauth-panel-head{display:flex;align-items:flex-start;gap:16px;padding:18px 20px;border-bottom:1px solid var(--separator);background:var(--surface-subtle)}
.oauth-panel-title{font-size:15px;font-weight:620}
.oauth-panel-copy{margin-top:3px;font-size:12.5px;line-height:1.5;color:var(--text-secondary)}
.oauth-accounts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.oauth-account{min-width:0;padding:20px;border-left:1px solid var(--separator);border-bottom:1px solid var(--separator)}
.oauth-account:nth-child(odd){border-left:0}
.oauth-account-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:15px}
.oauth-account-title{font-size:14px;font-weight:620;overflow-wrap:anywhere}
.oauth-account-meta{margin-top:3px;font-size:11.5px;line-height:1.45;color:var(--text-tertiary)}
.oauth-account-columns{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.oauth-block h4{margin-bottom:9px;font-size:12px;font-weight:620;color:var(--text-secondary)}
.quota-list{display:grid;gap:12px}
.quota-item{display:grid;gap:6px}
.quota-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:12px;color:var(--text-secondary)}
.quota-line strong{color:var(--text);font-weight:620;font-variant-numeric:tabular-nums}
.quota-track{height:7px;overflow:hidden;border-radius:4px;background:var(--surface-sunken)}
.quota-track>span{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.quota-track.warn>span{background:var(--warning)}
.quota-track.bad>span{background:var(--danger)}
 .quota-reset{font-size:11px;color:var(--text-tertiary)}
 .banked-reset{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
 .banked-reset-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
 .banked-reset-head strong{font-size:13px;color:var(--text)}
 .banked-reset-count{font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
 .banked-reset-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
 .banked-reset-item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 12px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-sunken)}
 .banked-reset-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--text)}
 .banked-reset-meta{grid-column:1/-1;font-size:11px;color:var(--text-tertiary)}
 .banked-reset-item .btn{grid-column:2;grid-row:1;white-space:nowrap}
 .banked-reset-note{font-size:11px;color:var(--text-tertiary);margin:7px 0 0}
.billing-total{font-size:22px;line-height:1.2;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.billing-label{font-size:11.5px;color:var(--text-tertiary)}
.billing-meta{margin-top:8px;font-size:12px;line-height:1.55;color:var(--text-secondary)}
.oauth-panel-foot{padding:12px 20px;background:var(--surface-subtle);font-size:11.5px;color:var(--text-tertiary)}
.oauth-panel-error{padding:16px 20px;border:1px solid var(--separator);border-radius:var(--radius-md);background:var(--danger-tint);color:var(--danger);font-size:12.5px}

/* Quota model: empirical Codex quota fitting, additive next to API cost. */
#quotaModelPanel{margin-top:24px}
.qm-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.qm-viewbar{display:inline-flex;align-items:center;gap:6px;padding:3px;border:1px solid var(--separator);border-radius:var(--radius-sm);background:var(--surface-subtle)}
.qm-viewbar .btn{box-shadow:none}
.qm-viewbar .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.qm-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));border-bottom:1px solid var(--separator)}
.qm-summary-cell{padding:14px 18px;border-right:1px solid var(--separator)}
.qm-summary-cell:last-child{border-right:0}
.qm-summary-label{display:block;font-size:11.5px;color:var(--text-tertiary)}
.qm-summary-value{display:block;margin-top:3px;font-size:15px;font-weight:620;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.qm-summary-sub{display:block;margin-top:2px;font-size:11px;color:var(--text-tertiary)}
.qm-cols{grid-template-columns:minmax(150px,1.2fr) 78px 118px 96px minmax(128px,1fr) minmax(132px,1fr)}
.qm-cols .qm-mult{font-weight:620;font-variant-numeric:tabular-nums}
.qm-ci{display:block;margin-top:1px;font-size:10.5px;color:var(--text-tertiary)}
.qm-tag{display:inline-block;margin-top:3px;padding:1px 6px;border-radius:var(--radius-xs);background:var(--surface-subtle);font-size:10.5px;color:var(--text-tertiary)}
.qm-accounts{padding:6px 20px 2px}
.qm-account{padding:14px 0;border-top:1px solid var(--separator)}
.qm-account:first-child{border-top:0}
.qm-account-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.qm-side{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px}
.qm-side-label{display:block;font-size:11px;color:var(--text-tertiary)}
.qm-side-value{display:block;margin-top:2px;font-size:14px;font-weight:620;font-variant-numeric:tabular-nums}
.qm-points{margin-top:12px;overflow:auto;max-height:300px;border:1px solid var(--separator);border-radius:var(--radius-sm)}
.qm-points.qm-collapsed{display:none}
.qm-points table{width:100%;border-collapse:collapse;font-size:12px}
.qm-points th,.qm-points td{padding:6px 10px;border-top:1px solid var(--separator);text-align:left;white-space:nowrap}
.qm-points thead th{border-top:0;background:var(--surface-subtle);font-size:11px;color:var(--text-tertiary)}
.qm-points td.num,.qm-points th.num{text-align:right;font-variant-numeric:tabular-nums}
.qm-points tr.qm-excluded{color:var(--danger)}
.qm-notes{margin:4px 20px 0;padding:0 0 16px;list-style:none;display:grid;gap:4px;font-size:12px;color:var(--text-secondary)}
.qm-foot{padding:12px 20px;background:var(--surface-subtle);font-size:11.5px;color:var(--text-tertiary)}


/* Usage */
.toolbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;padding:16px;border:1px solid var(--separator);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-1)}
.toolbar .field{flex:1 1 150px;max-width:230px}
.toolbar .toolbar-action{margin-left:auto;display:flex;align-items:center;gap:10px}
.usage-custom{display:grid;grid-template-columns:repeat(2,minmax(0,240px));gap:16px;padding:16px 0 0}
.filter-summary{margin-top:10px;font-size:12.5px;color:var(--text-secondary)}
.stat-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;overflow:hidden;padding:0;margin:0;border:1px solid var(--separator);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-1)}
.stat{display:flex;flex-direction:column;gap:4px;min-width:0;padding:16px;border-left:1px solid var(--separator)}
.stat:first-child{border-left:0}
.stat-label{font-size:11.5px;color:var(--text-secondary)}
.stat-value{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.018em;overflow-wrap:anywhere}
.stat-sub{font-size:11px;color:var(--text-tertiary)}
.cbar{display:flex;gap:2px;height:9px;border-radius:5px;overflow:hidden;background:var(--surface-sunken)}
.cbar span{display:block;min-width:2px}
.cbar-legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:12px;font-size:12px;color:var(--text-secondary)}
.cbar-legend em{display:inline-flex;align-items:center;gap:7px;font-style:normal}
.cbar-legend i{width:8px;height:8px;border-radius:2px;flex:none}
.cbar-legend b{font-weight:620;color:var(--text);font-variant-numeric:tabular-nums}
.chart-panel{padding:18px 14px 10px;overflow:hidden}
.trend-wrap{position:relative}
.trend-legend{display:flex;flex-wrap:wrap;gap:16px;padding:12px 6px 4px;font-size:11.5px;color:var(--text-secondary)}
.trend-legend span{display:inline-flex;align-items:center;gap:7px}
.legend-line{display:inline-block;width:18px;height:0;border-top:2px solid var(--series,var(--separator-strong))}
.legend-line.dash{border-top-style:dashed}
.trend-tip{position:absolute;z-index:5;min-width:190px;pointer-events:none;padding:10px 12px;background:var(--surface-elevated);border:1px solid var(--separator);border-radius:var(--radius-sm);box-shadow:var(--shadow-2);font-size:12px;color:var(--text-secondary)}
.tt-title{font-weight:620;color:var(--text);margin-bottom:5px}
.tt-row{display:flex;align-items:center;gap:7px}
.tt-row b{margin-left:auto;font-weight:620;color:var(--text);font-variant-numeric:tabular-nums}
.tt-dot{width:7px;height:7px;border-radius:2px;flex:none;display:inline-block}
.tt-sub{margin-top:5px;color:var(--text-tertiary)}

.table-wrap{overflow:auto}
.table-wrap.scroll{max-height:min(62vh,610px)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.tbl th{position:sticky;top:0;z-index:2;padding:10px 14px;text-align:left;white-space:nowrap;background:var(--surface-subtle);border-bottom:1px solid var(--separator);font-size:11.5px;font-weight:620;color:var(--text-tertiary)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--separator);vertical-align:top;color:var(--text-secondary)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-hover)}
.tbl td:first-child{color:var(--text)}
.model-req{font-weight:560;color:var(--text);overflow-wrap:anywhere}
.model-sub{margin-top:3px;font-size:11px;color:var(--text-tertiary);overflow-wrap:anywhere}
.model-sub.mismatch{color:var(--warning)}
.model-mismatch-tag{display:inline-flex;margin-right:6px;padding:1px 5px;border-radius:4px;background:var(--warning-tint);font-size:10.5px;font-weight:620}

/* Editors and overlays */
.sheet-back{position:fixed;inset:0;z-index:70;background:rgba(15,16,18,.26);opacity:0;visibility:hidden;transition:opacity .2s var(--ease),visibility .2s var(--ease)}
.sheet-back.on{opacity:1;visibility:visible}
.sheet{
  position:fixed;z-index:80;top:50%;left:50%;right:auto;width:min(1120px,calc(100vw - 32px));max-width:calc(100vw - 32px);height:auto;max-height:min(90dvh,calc(100dvh - 32px));overflow-x:hidden;overflow-y:auto;box-sizing:border-box;
  padding:28px;background:var(--surface-elevated);border:1px solid var(--separator);border-radius:var(--radius-lg);box-shadow:var(--shadow-2);
  transform:translate(-50%,calc(-50% + 8px));visibility:hidden;transition:transform .28s var(--ease),visibility .28s var(--ease);
}
.sheet.on{transform:translate(-50%,-50%);visibility:visible}
.sheet.wide{width:min(1240px,calc(100vw - 32px))}
.sheet>h3,.provider-editor-head h3{font-size:18px;font-weight:630;letter-spacing:-.012em}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:22px}
.form-grid .wide{grid-column:1/-1}
.subhead{font-size:14px;font-weight:620}
.hint{margin-top:4px;font-size:12px;line-height:1.5;color:var(--text-tertiary)}

/* Motion: short, directional feedback without delaying data or interaction. */
:root{--motion-ease:cubic-bezier(.22,1,.36,1);--motion-fast:180ms;--motion-page:360ms}
.login-shell{animation:motion-login 460ms var(--motion-ease) both}
@keyframes motion-login{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
#app.on .appbar{animation:motion-chrome 380ms var(--motion-ease) both}
@keyframes motion-chrome{from{opacity:.4;transform:translateY(-8px)}to{opacity:1;transform:none}}
.nav-list{position:relative}
.nav-glide{position:absolute;z-index:0;top:0;left:0;pointer-events:none;border:1px solid var(--separator);border-radius:9px;background:var(--surface);box-shadow:var(--shadow-1);transform:translate(var(--glide-x,3px),var(--glide-y,3px));transition:transform 360ms var(--motion-ease),width 360ms var(--motion-ease),height 360ms var(--motion-ease)}
.nav-glide:not(.ready){transition:none}
.motion-nav .nav-item{position:relative;z-index:1;transition:color var(--motion-fast) ease,transform var(--motion-fast) var(--motion-ease),background var(--motion-fast) ease}
.motion-nav .nav-item.on{background:transparent;border-color:transparent;box-shadow:none}
.motion-nav .nav-item:hover:not(.on){transform:translateY(-1px)}
.motion-nav .nav-item:active{transform:scale(.97)}
.motion-enter{animation:motion-page-in var(--motion-page) var(--motion-ease) both}
.motion-enter>.section,.motion-enter>.overview-grid,.motion-enter>.note{animation:motion-section-in 420ms var(--motion-ease) both}
.motion-enter>.section:nth-child(2),.motion-enter>.note{animation-delay:65ms}
.motion-enter>.section:nth-child(3){animation-delay:105ms}
@keyframes motion-page-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes motion-section-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-head.motion-heading{animation:motion-heading-in 300ms var(--motion-ease) both}
@keyframes motion-heading-in{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:none}}
.btn,.icon-btn,.datagrid-row,.list-row,.nav-item{will-change:auto}
.datagrid-row,.list-row{transition:background var(--motion-fast) ease,box-shadow var(--motion-fast) ease}
.datagrid-row:hover,.list-row:hover{box-shadow:inset 3px 0 0 var(--accent-tint-strong)}
.sheet-back{transition:opacity 280ms ease,visibility 280ms ease}
.sheet{transition:transform 390ms var(--motion-ease),visibility 390ms ease}
.sheet.on>h3,.sheet.on>.provider-editor-head{animation:motion-section-in 360ms var(--motion-ease) both}
.toast{animation-duration:280ms}
@media (prefers-reduced-motion:reduce){
  .nav-glide,.motion-nav .nav-item,.datagrid-row,.list-row,.sheet,.sheet-back{transition:none!important}
  .login-shell,#app.on .appbar,.motion-enter,.motion-enter>.section,.motion-enter>.overview-grid,.motion-enter>.note,.page-head.motion-heading,.sheet.on>h3,.sheet.on>.provider-editor-head{animation:none!important}
}
@media (forced-colors:active){.nav-glide{border-color:Highlight;background:Highlight}.motion-nav .nav-item.on{color:HighlightText}}

<script>
const base = "/gui";
const DEFAULT_CONTEXT_WINDOW=272000;
let csrfToken=localStorage.getItem("cpa-csrf")||"";
const api = (p, opts={}) => fetch(base + "/api" + p, {headers:{"Content-Type":"application/json","X-CSRF-Token":csrfToken}, ...opts}).then(async r=>{
  const d = await r.json().catch(()=>({}));
  if(r.status===401 && !location.hash.includes("keys")){ showLogin(); throw new Error("unauthorized"); }
  if(!r.ok) throw new Error(d.error || ("HTTP "+r.status));
  return d;
});
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (n==null?"—":Number(n).toLocaleString("zh-CN"));
const fmtShort = n => { n=Number(n||0); if(n>=1e9)return (n/1e9).toFixed(1)+"B"; if(n>=1e6)return (n/1e6).toFixed(1)+"M"; if(n>=1e3)return (n/1e3).toFixed(1)+"K"; return String(n); };
const fmtDuration = ms => { ms=Number(ms||0); if(ms<1000) return ms?ms+" ms":"—"; if(ms<60000) return (ms/1000).toFixed(2)+" s"; return Math.floor(ms/60000)+" 分 "+Math.round((ms%60000)/1000)+" 秒"; };
const fmtTps = n => n?Number(n).toFixed(1)+" t/s":"—";
const fmtCost = n => "$"+Number(n||0).toFixed(6);
const fmtClock = t => t?new Date(Number(t)*1000).toLocaleString("zh-CN",{hour12:false,month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}):"—";
const shortKey = k => { k=String(k||""); return k.length>16?k.slice(0,16)+"…":k; };
const modelName = value => String(value||"").trim().split("/").pop();
const recentModelCell = c => {
  const requested=String(c.model||"").trim();
  const reported=String(c.upstream_reported_model||"").trim();
  const routed=String(c.routed_model||"").trim();
  const mismatch=Boolean(reported && requested && modelName(reported)!==modelName(requested));
  const lines=[`请求：${requested||"—"}`];
  if(routed) lines.push(`路由：${routed}`);
  lines.push(`上游响应：${reported||"—"}`);
  const title=lines.join("\n");
  return `<div class="model-req">${esc(requested||"—")}</div><div class="model-sub${mismatch?" mismatch":""}" title="${esc(title)}">${mismatch?'<span class="model-mismatch-tag">模型不一致</span>':''}上游响应：${esc(reported||"—")}</div>`;
};
const timeAgo = t => { if(!t) return "从未使用"; const d=Math.floor(Date.now()/1000-t); if(d<60)return d+" 秒前"; if(d<3600)return Math.floor(d/60)+" 分钟前"; if(d<86400)return Math.floor(d/3600)+" 小时前"; return new Date(t*1000).toLocaleDateString("zh-CN"); };
const dateStr = t => new Date(t*1000).toLocaleDateString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
/* ---------- area trend chart (cc-switch style) ---------- */
const CHART_SERIES=[
  {key:"input",name:"未缓存输入",color:"var(--series-input)",dash:""},
  {key:"output",name:"输出",color:"var(--series-output)",dash:"7 4"},
  {key:"cached",name:"缓存命中",color:"var(--series-cached)",dash:"2 4"},
  {key:"cost",name:"费用（右轴）",color:"var(--series-cost)",axis:"right",area:false,dash:"12 5"},
];
function niceMax(v){
  if(!(v>0)) return 1;
  const p=Math.pow(10,Math.floor(Math.log10(v)));
  const m=v/p;
  const n=m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10;
  return n*p;
}
function fmtAxis(v){
  if(v>=1e9) return (v/1e9).toFixed(1)+"B";
  if(v>=1e6) return (v/1e6).toFixed(1)+"M";
  if(v>=1e3) return (v/1e3).toFixed(v>=1e5?0:1)+"k";
  return String(Math.round(v));
}
function fmtCostAxis(v){
  v=Math.max(0,Number(v)||0);
  if(v>=1000) return "$"+(v/1000).toFixed(v>=10000?0:1)+"k";
  if(v>=1) return "$"+v.toFixed(v>=100?0:v>=10?1:2);
  if(v>=.01) return "$"+v.toFixed(2);
  if(v>=.0001) return "$"+v.toFixed(4);
  return v>0?"$"+v.toFixed(6):"$0";
}
function chartXForTimestamp(ts,minTs,maxTs,padL,plotW){
  const span=Number(maxTs)-Number(minTs);
  if(!(span>0)) return padL+plotW/2;
  const ratio=Math.max(0,Math.min(1,(Number(ts)-Number(minTs))/span));
  return padL+plotW*ratio;
}
function nearestPointIndex(times,targetTs){
  if(!times.length) return -1;
  let lo=0,hi=times.length-1;
  while(lo<=hi){
    const mid=(lo+hi)>>1, value=Number(times[mid]);
    if(value===targetTs) return mid;
    if(value<targetTs) lo=mid+1; else hi=mid-1;
  }
  const left=Math.max(0,hi), right=Math.min(times.length-1,lo);
  return Math.abs(Number(times[left])-targetTs)<=Math.abs(Number(times[right])-targetTs)?left:right;
}
function smoothLine0(vals,x,y){
  if(!vals.length) return "";
  const n=vals.length;
  const pts=vals.map((v,i)=>({x:x(i), y:y(Math.max(0,Number(v)||0))}));
  if(n===1) return "M "+pts[0].x.toFixed(2)+" "+pts[0].y.toFixed(2);
  const slope=(a,b)=>(b.y-a.y)/(b.x-a.x);
  const m=Array(n).fill(0);
  m[0]=slope(pts[0],pts[1]); m[n-1]=slope(pts[n-2],pts[n-1]);
  for(let i=1;i<n-1;i++) m[i]=(slope(pts[i-1],pts[i])+slope(pts[i],pts[i+1]))/2;
  for(let i=0;i<n-1;i++){
    const dx=pts[i+1].x-pts[i].x, dy=pts[i+1].y-pts[i].y;
    if(Math.abs(dy)<1e-9){ m[i]=0; m[i+1]=0; continue; }
    const s=dy/dx, a=m[i]/s, b=m[i+1]/s;
    if(a<0) m[i]=0; if(b<0) m[i+1]=0;
    const t=a*a+b*b;
    if(t>9){ const k=3/Math.sqrt(t); m[i]=k*a*s; m[i+1]=k*b*s; }
  }
  const out=["M "+pts[0].x.toFixed(2)+" "+pts[0].y.toFixed(2)];
  for(let i=0;i<n-1;i++){
    const dx=pts[i+1].x-pts[i].x;
    const c1y=pts[i].y+m[i]*dx/3, c2y=pts[i+1].y-m[i+1]*dx/3;
    out.push(`C ${(pts[i].x+dx/3).toFixed(2)} ${c1y.toFixed(2)}, ${(pts[i+1].x-dx/3).toFixed(2)} ${c2y.toFixed(2)}, ${pts[i+1].x.toFixed(2)} ${pts[i+1].y.toFixed(2)}`);
  }
  return out.join(" ");
}
function smoothLine(vals,x,y){ return smoothLine0(vals,x,y); }
function renderAreaChart(el,pts,opts={}){
  const uid=opts.uid||"c", series=opts.series||CHART_SERIES;
  const rightSeries=series.filter(s=>s.axis==="right"), leftSeries=series.filter(s=>s.axis!=="right");
  const measured=Math.round(el.getBoundingClientRect().width||960);
  const H=opts.height||280, W=Math.max(720,Math.min(1440,measured||960)), padL=54, padR=rightSeries.length?68:14, padT=14, padB=30;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const n=pts.length;
  if(!n){ el.innerHTML=`<div class="empty" style="text-align:center;padding:40px 0">暂无数据</div>`; return; }
  const times=pts.map(p=>Number(p.ts));
  const monotonic=times.every((t,i)=>Number.isFinite(t)&&(i===0||t>=times[i-1]));
  const useTimeAxis=monotonic&&times.length===n&&times[n-1]>times[0];
  const minTs=useTimeAxis?times[0]:0, maxTs=useTimeAxis?times[n-1]:0;
  const safeVals=leftSeries.flatMap(s=>pts.map(p=>Math.max(0,Number(p[s.key])||0)));
  const rightVals=rightSeries.flatMap(s=>pts.map(p=>Math.max(0,Number(p[s.key])||0)));
  const maxV=niceMax(Math.max(1,...safeVals));
  const rightPeak=Math.max(0,...rightVals);
  const maxRight=niceMax(rightPeak>0?rightPeak:.01);
  const xIndex=i=>padL+(n>1?plotW*i/(n-1):plotW/2);
  const x=i=>useTimeAxis?chartXForTimestamp(times[i],minTs,maxTs,padL,plotW):xIndex(i);
  const y=v=>padT+plotH*(1-Math.max(0,Math.min(v,maxV))/maxV);
  const yRight=v=>padT+plotH*(1-Math.max(0,Math.min(v,maxRight))/maxRight);
  const seriesY=(s,v)=>s.axis==="right"?yRight(v):y(v);
  const baseY=padT+plotH;
  let grid="",yt="",yr="";
  for(let t=0;t<=4;t++){
    const v=maxV*t/4, yy=y(v);
    grid+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${(W-padR).toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--sep)" stroke-dasharray="3 3"/>`;
    yt+=`<text x="${padL-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" fill="var(--text3)" font-size="11">${fmtAxis(v)}</text>`;
    if(rightSeries.length){
      const rv=maxRight*t/4;
      yr+=`<text x="${W-padR+8}" y="${(yy+4).toFixed(1)}" text-anchor="start" fill="${rightSeries[0].color}" font-size="11">${fmtCostAxis(rv)}</text>`;
    }
  }
  const tc=Math.min(n,6);
  const xIdx=tc>1?Array.from({length:tc},(_,k)=>Math.round((n-1)*k/(tc-1))):[0];
  const xticks=xIdx.map(i=>`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" fill="var(--text3)" font-size="11">${esc(pts[i].label)}</text>`).join("");
  const defs="";
  const areas=series.map(s=>{
    const vals=pts.map(p=>Math.max(0,Number(p[s.key])||0));
    const sy=v=>seriesY(s,v);
    const ln=smoothLine(vals,x,sy);
    const ar=ln?`${ln} L ${x(n-1).toFixed(1)} ${baseY} L ${x(0).toFixed(1)} ${baseY} Z`:"";
    const fill=s.area===false?"":`<path d="${ar}" fill="${s.color}" fill-opacity=".10"/>`;
    return `${fill}<path d="${ln}" fill="none" stroke="${s.color}" stroke-width="${s.axis==="right"?2.4:2}" stroke-dasharray="${s.dash||""}" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join("");
  const hdots=series.map(s=>`<circle cx="0" cy="0" r="3.5" fill="${s.color}" stroke="var(--card-strong)" stroke-width="1.5" visibility="hidden"/>`).join("");
  el.innerHTML=`<div class="trend-wrap">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Token 与费用趋势">
      <defs>${defs}</defs>${grid}${yt}${yr}${xticks}${areas}
      <line class="h-line" x1="0" y1="${padT}" x2="0" y2="${baseY}" stroke="var(--text3)" stroke-width="1" visibility="hidden"/>
      <g class="h-dots">${hdots}</g>
      <rect class="h-catch" x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="transparent" style="cursor:crosshair"/>
    </svg>
    <div class="trend-tip" hidden></div>
  </div>
  <div class="trend-legend" aria-label="趋势图图例">${series.map(s=>`<span><i class="legend-line${s.dash?" dash":""}" style="--series:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
  const svg=el.querySelector("svg"), cat=el.querySelector(".h-catch"), hl=el.querySelector(".h-line"), hd=el.querySelector(".h-dots"), tip=el.querySelector(".trend-tip");
  const hide=()=>{ hl.setAttribute("visibility","hidden"); hd.querySelectorAll("circle").forEach(c=>c.setAttribute("visibility","hidden")); tip.hidden=true; };
  cat.addEventListener("mousemove",ev=>{
    const r=svg.getBoundingClientRect();
    const px=(ev.clientX-r.left)*(W/r.width);
    const ratio=(px-padL)/plotW;
    if(ratio<0||ratio>1){ hide(); return; }
    const targetTs=useTimeAxis?minTs+ratio*(maxTs-minTs):null;
    const i=useTimeAxis?nearestPointIndex(times,targetTs):Math.round(ratio*(n-1));
    if(i<0||i>=n){ hide(); return; }
    const xx=x(i);
    hl.setAttribute("x1",xx); hl.setAttribute("x2",xx); hl.setAttribute("visibility","visible");
    hd.querySelectorAll("circle").forEach((c,k)=>{ c.setAttribute("cx",xx); c.setAttribute("cy",seriesY(series[k],Math.max(0,Number(pts[i][series[k].key])||0))); c.setAttribute("visibility","visible"); });
    const p=pts[i];
    tip.innerHTML=`<div class="tt-title">${esc(p.label)}</div>${series.map(s=>{const value=Math.max(0,Number(p[s.key])||0);return `<div class="tt-row" style="color:${s.color}"><span class="tt-dot" style="background:${s.color}"></span>${esc(s.name)}<b>${s.axis==="right"?fmtCost(value):fmt(value)}</b></div>`;}).join("")}<div class="tt-sub">请求 ${fmt(Math.max(0,p.requests||0))}${p.output_tps?` · 均速 ${fmtTps(p.output_tps)}`:""}</div>`;
    tip.hidden=false;
    const tx=Math.min(ev.clientX-r.left+14,r.width-190), ty=Math.max(ev.clientY-r.top+12,10);
    tip.style.left=Math.max(0,tx)+"px"; tip.style.top=ty+"px";
  });
  cat.addEventListener("mouseleave",hide);
}

const THINKING_PRESETS=[
  ["low","medium","high","xhigh","max","ultra"],
  ["low","medium","high","xhigh","max"],
  ["low","medium","high","xhigh"],
  ["low","medium","high","max"],
  ["low","medium","high"],
  ["low","medium"]
];
function thinkingOptions(levels){
  const current=(levels&&levels.length?levels:["low","medium","high","xhigh","max"]).join(",");
  const values=[current,...THINKING_PRESETS.map(x=>x.join(","))].filter((v,i,a)=>a.indexOf(v)===i);
  return values.map(v=>`<option value="${esc(v)}" ${v===current?"selected":""}>${esc(v.split(",").join(" · "))}</option>`).join("");
}

function normalizeProviderPrefix(value){return String(value||"").trim().replace(/^\/+|\/+$/g,"");}
function downstreamModelName(prefix,clientName){const p=normalizeProviderPrefix(prefix),c=String(clientName||"").trim().replace(/^\/+/ ,"");return p?(c?`${p}/${c}`:`${p}/`):c;}
function parseDownstreamModelName(value,prefix){const p=normalizeProviderPrefix(prefix),full=String(value||"").trim(),start=p?`${p}/`:"";if(p&&!full.startsWith(start))throw new Error(`下游请求名称必须以 ${start} 开头`);const client=(p?full.slice(start.length):full).trim().replace(/^\/+/ ,"");if(!client)throw new Error("下游请求名称不能为空");if(client.includes("/"))throw new Error("下游模型名称不能包含 / ");return client;}
function normalizeDownstreamModels(card,p){
  const models=p.models||[],seen=new Set();
  card.querySelectorAll('[data-f="downstreamName"]').forEach(node=>{
    const i=+node.dataset.i,client=parseDownstreamModelName(node.value,p.prefix),full=downstreamModelName(p.prefix,client);
    if(seen.has(full)) throw new Error(`下游请求名称重复：${full}`);
    seen.add(full); models[i].clientName=client; node.value=full;
  });
}

async function saveProviderPrices(card,currentPrices){
  const prices=JSON.parse(JSON.stringify(currentPrices||{}));
  for(const row of card.querySelectorAll('[data-role="prices"] .price-row')){
    const name=row.dataset.priceModel;
    const number=field=>{
      const value=Number(row.querySelector('[data-price-field="'+field+'"]').value||0);
      if(!Number.isFinite(value)||value<0) throw new Error("价格必须是非负数字");
      return Math.round(value*1e8)/1e8;
    };
    prices[name]={input:number("input"),cached:number("cached"),write:number("write"),output:number("output")};
  }
  const result=await api("/prices",{method:"PUT",body:JSON.stringify({prices:prices})});
  return result.prices||prices;
}

function quotaResetEpochSeconds(value){
  if(value===null||value===undefined||value==="") return null;
  if(typeof value==="number"||/^\d+(?:\.\d+)?$/.test(String(value).trim())){
    const n=Number(value);
    if(!Number.isFinite(n)||n<=0) return null;
    return n>=100000000000?n/1000:n;
  }
  const parsed=Date.parse(String(value));
  return Number.isFinite(parsed)?parsed/1000:null;
}
function quotaResetCountdown(epochSeconds,now=Date.now()){
  const remainingMs=Number(epochSeconds)*1000-now;
  if(!Number.isFinite(remainingMs)) return '重置时间未知';
  if(remainingMs<=0) return '已到重置时间';
  let minutes=Math.ceil(remainingMs/60000);
  const days=Math.floor(minutes/1440); minutes%=1440;
  const hours=Math.floor(minutes/60); minutes%=60;
  const parts=[];
  if(days) parts.push(`${days}天`);
  if(hours||days) parts.push(`${hours}小时`);
  parts.push(`${minutes}分钟`);
  return `重置倒计时：${parts.join(' ')}`;
}
function stopOAuthQuotaCountdown(panel){
  if(panel&&panel._oauthQuotaCountdownTimer){
    clearTimeout(panel._oauthQuotaCountdownTimer);
    panel._oauthQuotaCountdownTimer=null;
  }
}
function startOAuthQuotaCountdown(panel){
  stopOAuthQuotaCountdown(panel);
  const tick=()=>{
    if(!panel.isConnected){stopOAuthQuotaCountdown(panel);return;}
    panel.querySelectorAll('.quota-reset[data-reset-at]').forEach(el=>{
      el.textContent=quotaResetCountdown(Number(el.dataset.resetAt));
    });
    // Align updates to the next minute boundary so the displayed minute stays current.
    panel._oauthQuotaCountdownTimer=setTimeout(tick,60000-(Date.now()%60000));
  };
  tick();
}

function oauthWindowText(w){
  if(!w) return '<p class="muted">官方未提供</p>';
  const seconds=Number(w.limit_window_seconds||0);
  const label=seconds===604800?'周额度':seconds===18000?'5 小时额度':`${Math.round(seconds/3600)} 小时额度`;
  const used=typeof w.used_percent==='number'?Math.max(0,Math.min(100,Number(w.used_percent))):null;
  const remain=typeof w.remaining_percent==='number'?Math.max(0,Math.min(100,Number(w.remaining_percent))):(used==null?null:100-used);
  const resetAt=quotaResetEpochSeconds(w.reset_at);
  const cls=used==null?'':used>=90?' bad':used>=70?' warn':'';
  return `<div class="quota-item">
    <div class="quota-line"><span>${esc(label)}</span><strong>${used==null?'未知':fmt(used)+'% 已用 · '+fmt(remain)+'% 剩余'}</strong></div>
    <div class="quota-track${cls}" role="progressbar" aria-label="${esc(label)}已用额度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${used==null?0:used}"><span style="width:${used==null?0:used}%"></span></div>
    <div class="quota-reset"${resetAt===null?'':` data-reset-at="${esc(resetAt)}"`}>${esc(resetAt===null?'重置时间未知':quotaResetCountdown(resetAt))}</div>
  </div>`;
}
function resetDateText(value){
  if(value===null||value===undefined||value==="") return "未知";
  let d;
  if(typeof value==="number"||/^\d{10,13}$/.test(String(value))){const n=Number(value);d=new Date(n<100000000000?n*1000:n);}
  else d=new Date(value);
  return Number.isNaN(d.getTime())?esc(value):esc(d.toLocaleString());
}
function bankedResetHTML(reset,account){
