async function loadOAuthAccounts(panel,{silent=false,force=false}={}){
  const loadId=panel._oauthLoadId=(panel._oauthLoadId||0)+1;
  if(!silent) stopOAuthQuotaCountdown(panel);
  clearTimeout(oauthBillingRefreshTimer); oauthBillingRefreshTimer=null;
  if(!silent) panel.innerHTML='<div class="oauth-panel"><div class="oauth-panel-head"><div><h3 class="oauth-panel-title">OAuth 账号与额度</h3><p class="oauth-panel-copy">正在读取官方额度与 CPA 计费数据…</p></div></div></div>';
  try{
    const data=await api('/oauth-accounts?include_reset=0'+(force?'&fresh=1':''));
    if(!panel.isConnected||panel._oauthLoadId!==loadId||page!=="subs") return;
    const previousResetBlocks=new Map(silent?Array.from(panel.querySelectorAll('[data-reset-prefix]')).map(el=>[el.getAttribute('data-reset-prefix'),el.outerHTML]):[]);
    const accounts=(data.accounts||[]).map(a=>{
      const q=a.quota||{}, r=q.rate_limit||{}, b=a.billing||{};
      const money=!data.billing_available?'统计不可用':b.window_available?'$'+Number(b.cost_usd||0).toFixed(6):'周额度周期不可用';
      const cycle=b.window_available?`本周期：${new Date(b.cycle_start_ts*1000).toLocaleString()} — ${new Date(b.cycle_end_ts*1000).toLocaleString()}`:'官方未提供可识别的 7 天额度周期';

          <span class="badge plain">${esc(a.prefix)}/</span><span class="badge ${a.stale?'warn':'ok'}">${a.stale?'数据过期':'已更新'}</span>
        </div>
        <div class="oauth-account-columns">
          <div class="oauth-block"><h4>官方额度</h4><div class="quota-list">${quotaBlocks||'<p class="muted">官方未提供</p>'}</div>${r.limit_reached?'<p class="muted">官方报告：额度已达上限</p>':''}${resetBlock}</div>
          <div class="oauth-block"><p class="billing-label">当前额度周期内的 CPA 估算费用</p><div class="billing-total">${esc(money)}</div><p class="billing-meta">${fmt(b.requests||0)} 次调用<br>未缓存输入 ${fmt(b.input||0)} · 缓存输入 ${fmt(b.cached||0)} · 输出 ${fmt(b.output||0)}<br>${esc(cycle)}<br>${esc(seen)}${asOf?'<br>'+esc(asOf):''}${b.unpriced_requests?'<br>'+fmt(b.unpriced_requests)+' 条记录未设置价格，不计入金额':''}</p></div>
        </div>
      </section>`;
    }).join('')||'<div class="empty">尚无账号数据</div>';
    panel.innerHTML=`<div class="oauth-panel">
      <div class="oauth-panel-head"><div class="grow"><h3 class="oauth-panel-title">OAuth 账号 · 官方额度 / CPA 计费</h3><p class="oauth-panel-copy">仅统计本额度周期内经对应 OAuth 账号的 CPA 调用，按调用时间戳筛选与当前单价估算；官方额度百分比不是 CPA 费用。</p></div><button class="btn btn-secondary btn-sm" data-oauth-refresh>刷新</button></div>

    </div>`;
    startOAuthQuotaCountdown(panel);
    panel.querySelector('[data-oauth-refresh]').onclick=()=>loadOAuthAccounts(panel,{force:true});
    // Reset credits use a slower read-only management call; do not block
    // official quota and CPA billing while waiting for it.
    if(silent) wireOAuthResetButtons(panel);
    else api('/oauth-reset-credits').then(resetData=>{
      if(!panel.isConnected||panel._oauthLoadId!==loadId||page!=="subs") return;
      (data.accounts||[]).forEach(a=>{
        const target=Array.from(panel.querySelectorAll('[data-reset-prefix]')).find(el=>el.getAttribute('data-reset-prefix')===String(a.prefix));
        if(!target) return;
        const reset=(resetData.accounts||{})[a.prefix]||{status:'unavailable'};
        target.outerHTML=bankedResetHTML(reset,a);
      });
      wireOAuthResetButtons(panel);
    }).catch(()=>{
      if(!panel.isConnected||panel._oauthLoadId!==loadId||page!=="subs") return;
      (data.accounts||[]).forEach(a=>{
        const target=Array.from(panel.querySelectorAll('[data-reset-prefix]')).find(el=>el.getAttribute('data-reset-prefix')===String(a.prefix));
        if(target) target.outerHTML=bankedResetHTML({status:'unavailable'},a);
      });
    });
    const nextCycleEnd=(data.accounts||[]).map(a=>Number((a.billing||{}).cycle_end_ts||0)).filter(ts=>Number.isFinite(ts)&&ts>Date.now()/1000).sort((a,b)=>a-b)[0];
    const untilReset=nextCycleEnd?Math.max(1000,(nextCycleEnd-Date.now()/1000)*1000+1000):OAUTH_BILLING_POLL_MS;
    oauthBillingRefreshTimer=setTimeout(()=>{
      if(page==="subs"&&panel.isConnected) loadOAuthAccounts(panel,{silent:true});
    },Math.min(OAUTH_BILLING_POLL_MS,untilReset));
  }catch(e){
    if(!panel.isConnected||panel._oauthLoadId!==loadId||page!=="subs") return;
    if(!silent) panel.innerHTML='<div class="oauth-panel-error">OAuth 账号信息读取失败：'+esc(e.message)+'</div>';
    else oauthBillingRefreshTimer=setTimeout(()=>{
      if(page==="subs"&&panel.isConnected) loadOAuthAccounts(panel,{silent:true});
    },OAUTH_BILLING_POLL_MS);
  }
}

/* ---------- quota model (empirical Codex quota fitting) ---------- */
const QUOTA_MODEL_VIEWS=[
  {key:"recent6",label:"近 6 个周期",window:"recent",cycles:6},
  {key:"recent12",label:"近 12 个周期",window:"recent",cycles:12},
  {key:"all",label:"全部历史",window:"all",cycles:24},
];
const QUOTA_STATUS_LABEL={stable:"Stable",experimental:"Experimental",poorly_identified:"Poorly identified",insufficient_data:"Insufficient data",computing:"计算中"};
const QUOTA_STATUS_TAG={stable:"ok",experimental:"warn",poorly_identified:"bad",insufficient_data:"plain",computing:"plain"};
const QUOTA_REGIME_LABEL={stable:"Stable",drifting:"Drifting",shifted:"Changed",unknown:"Unknown"};
function quotaStatusLabel(value){return QUOTA_STATUS_LABEL[value]||String(value||"—");}
function quotaStatusTag(value){return QUOTA_STATUS_TAG[value]||"plain";}
function quotaModelViewKey(){return localStorage.getItem("cpa-quota-model-view")||"recent6";}
function quotaModelView(){return QUOTA_MODEL_VIEWS.find(v=>v.key===quotaModelViewKey())||QUOTA_MODEL_VIEWS[0];}
function qmMult(value){return value==null?"—":Number(value).toFixed(3)+"x";}
function qmCi(ci){if(!ci||ci.length!==2||ci[0]==null||ci[1]==null)return "";return "95% CI "+Number(ci[0]).toFixed(3)+" – "+Number(ci[1]).toFixed(3);}
function qmPp(value){if(value==null)return "—";const n=Number(value);return (n>0?"+":"")+n.toFixed(4)+" pp";}
function qmMetric(value,digits){return value==null?"—":Number(value).toFixed(digits==null?4:digits);}
function qmStamp(ts){if(!ts)return "—";return new Date(Number(ts)*1000).toLocaleString("zh-CN",{hour12:false,month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});}
function qmSpanText(span){if(!span||!span.start_ts)return "—";return qmStamp(span.start_ts)+" — "+qmStamp(span.end_ts);}

function quotaModelHTML(data,view){
  const computing=Boolean(data.computing);
  const status=computing?"computing":String(data.status||"insufficient_data");
  const models=data.models||{};
  const metrics=data.metrics||{};
  const inSample=metrics.in_sample||{};
  const holdout=metrics.test||null;
  const regime=data.regime||{};
  const accounts=data.accounts||[];
  const spans=accounts.map(a=>a.span).filter(s=>s&&s.start_ts);
  const span=spans.length?{start_ts:Math.min.apply(null,spans.map(s=>s.start_ts)),end_ts:Math.max.apply(null,spans.map(s=>s.end_ts))}:null;
  const excluded=accounts.reduce((total,a)=>total+Number((((a.fit||{}).diagnostics||{}).observations_excluded)||0),0);
  const summary=[
    ["Model status",quotaStatusLabel(status),"最弱一项决定整体状态"],
    ["Observations",fmt(data.observations||0),"排除 "+fmt(excluded)+" 条异常观测"],
    ["Quota cycles",fmt(data.cycles_count||0),"视图："+view.label],
    ["Training span",qmSpanText(span),"仅在同一 cycle 内做差"],
    ["MAE / RMSE",qmMetric(inSample.mae)+" / "+qmMetric(inSample.rmse),"R² "+qmMetric(inSample.r2)+"（in-sample）"],
    ["MAE / RMSE（hold-out）",holdout?(qmMetric(holdout.mae)+" / "+qmMetric(holdout.rmse)):"—",holdout?("R² "+qmMetric(holdout.r2)+" · 时间顺序 80/20，未打乱"):"观测不足，未做留出验证"],
    ["Billing model",String(data.billing_model_version||"—"),"fitting epoch "+qmStamp(data.fitting_epoch)],
    ["Regime stability",String(QUOTA_REGIME_LABEL[regime.status]||regime.status||"Unknown"),"比较 "+fmt(regime.cycles_compared||0)+" 个周期 · 最大漂移 "+qmMetric(regime.max_input_drift,3)],
  ];
  const modelKeys=Object.keys(models).sort();
  const modelRows=modelKeys.map(key=>{
    const info=models[key]||{};
    const modelStatus=String(info.status||"insufficient_data");
    const blind=modelStatus==="insufficient_data";
    const pooled=String(info.source||"")==="pooled";
    const flags=info.status_flags||[];
    const confidence=(flags.indexOf("insufficient_variation")>=0)?"Insufficient variation":quotaStatusLabel(modelStatus);
    const owners=(info.accounts||[]).join(" · ");
    const active=Number(info.active_observations||0);
    return `<div class="datagrid-row qm-cols">
      <span class="row-main"><span class="row-title mono">${esc(key)}</span><span class="row-sub">${owners?esc(owners):"未归属"} · active obs ${fmt(active)}</span>${pooled?`<span class="qm-tag">Estimated from pooled data</span>`:``}</span>
      <span class="cell qm-mult">${blind?"—":"1.000x"}</span>
      <span class="cell qm-mult">${blind?"—":esc(qmMult(info.cache_multiplier))+`<span class="qm-ci">${esc(qmCi(info.cache_ci))}</span>`}</span>
      <span class="cell qm-mult">${blind?"—":esc(qmMult(info.output_multiplier))+`<span class="qm-ci">${esc(qmCi(info.output_ci))}</span>`}</span>
      <span class="cell qm-mult">${blind?"—":esc(qmMult(info.relative_input_weight))+`<span class="qm-ci">${esc(String(info.relative_input_weight_status||""))}</span>`}</span>
      <span class="cell"><span class="badge ${quotaStatusTag(modelStatus)}">${esc(confidence)}</span></span>
    </div>`;
  }).join("");
  const accountBlocks=accounts.map(acc=>{
    const fit=acc.fit||{};
    const fitStatus=String(fit.status||"insufficient_data");
    const diag=fit.diagnostics||{};
    const points=(acc.points||[]).slice(-40);
    const rows=points.map(point=>`<tr${point.excluded?` class="qm-excluded"`:``}><td>${esc(qmStamp(point.start_ts))}</td><td class="num">${qmMetric(point.actual,4)}</td><td class="num">${point.predicted==null?"—":qmMetric(point.predicted,4)}</td><td class="num">${point.residual==null?"—":qmPp(point.residual)}</td><td>${point.excluded?esc(point.exclude_reason||"excluded"):(point.is_rounded?"rounded":"included")}</td></tr>`).join("");
    return `<div class="qm-account">
      <div class="qm-account-head"><span class="mono">${esc(acc.prefix||"?")}</span><span class="muted">${esc(acc.label||"")}</span><span class="badge ${quotaStatusTag(fitStatus)}">${esc(quotaStatusLabel(fitStatus))}</span><span class="muted">观测 ${fmt(acc.observations||0)} · 快照 ${fmt(acc.snapshots||0)}</span></div>
      <div class="qm-side">
        <div><span class="qm-side-label">API Equivalent Cost（既有模型，独立）</span><span class="qm-side-value">${acc.api_cost_usd==null?"—":esc(fmtCost(acc.api_cost_usd))}</span></div>
        <div><span class="qm-side-label">Observed Weekly Quota</span><span class="qm-side-value">${acc.observed_used_percent==null?"—":Number(acc.observed_used_percent).toFixed(2)+"%"}</span></div>
        <div><span class="qm-side-label">Observed ΔQ（窗口内）</span><span class="qm-side-value">${qmPp(acc.observed_change_pp)}</span></div>
        <div><span class="qm-side-label">Empirical Predicted ΔQ</span><span class="qm-side-value">${qmPp(acc.predicted_change_pp)}</span></div>
        <div><span class="qm-side-label">Residual</span><span class="qm-side-value">${qmPp(acc.residual_pp)}</span></div>
      </div>
      <p class="billing-meta">聚合窗口 ${fmtDuration(Number(acc.window_seconds||0)*1000)} · 训练区间 ${esc(qmSpanText(acc.span))} · 排除 ${fmt(Number(diag.observations_excluded||0))} 条${acc.cycle_end_ts?`<br>当前额度周期 ${esc(qmStamp(acc.cycle_start_ts))} — ${esc(qmStamp(acc.cycle_end_ts))}`:``}</p>
      ${points.length?`<div class="qm-points qm-collapsed"><table><thead><tr><th>区间开始</th><th class="num">实际 ΔQ</th><th class="num">拟合</th><th class="num">残差</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table></div>`:``}
    </div>`;
  }).join("");
  const notes=(data.notes||[]).map(note=>`<li>• ${esc(note)}</li>`).join("");
  return `<div class="oauth-panel">
    <div class="oauth-panel-head">
      <div class="grow"><h3 class="oauth-panel-title">额度拟合 · Quota Model <span class="badge ${quotaStatusTag(status)}">${esc(quotaStatusLabel(status))}</span></h3>
      <p class="oauth-panel-copy">经验系数（empirical coefficient / observed quota coefficient）：由额度快照差分与 CPA token 记录拟合，不使用官方 API 价格校准，与上方 API Equivalent Cost 完全独立。</p></div>
      <div class="qm-toolbar">
        <div class="qm-viewbar">${QUOTA_MODEL_VIEWS.map(item=>`<button class="btn btn-secondary btn-sm" type="button" data-qm-view="${item.key}" aria-pressed="${item.key===view.key?"true":"false"}">${esc(item.label)}</button>`).join("")}</div>
        <button class="btn btn-secondary btn-sm" type="button" data-qm-refresh>立即刷新</button>
        ${accountBlocks?`<button class="btn btn-secondary btn-sm" type="button" data-qm-points>显示观测明细</button>`:``}
      </div>
    </div>
    <div class="qm-summary">${summary.map(item=>`<div class="qm-summary-cell"><span class="qm-summary-label">${esc(item[0])}</span><span class="qm-summary-value">${esc(item[1])}</span><span class="qm-summary-sub">${esc(item[2])}</span></div>`).join("")}</div>
    <div class="datagrid"><div class="datagrid-head qm-cols"><span>Model</span><span>Input</span><span>Cache Hit</span><span>Output</span><span>Relative Input Weight</span><span>Confidence</span></div>
      ${modelRows||`<div class="datagrid-row"><span class="muted">尚无可用模型观测：样本不足时不显示倍率</span></div>`}</div>
    ${accountBlocks?`<div class="qm-accounts">${accountBlocks}</div>`:``}
    ${notes?`<ul class="qm-notes">${notes}</ul>`:``}
    <div class="qm-foot">${esc(computing?"拟合进行中：后台线程计算，稍后自动刷新。":"观测 "+fmt(data.observations||0)+" 个区间 · 全部历史视图为实验性质，默认使用最近若干完整周期；数据不足时显示 “—”，不伪造精度。")}</div>
  </div>`;
}

async function loadQuotaModel(panel,opts){
  const options=opts||{};
  const loadId=panel._qmLoadId=(panel._qmLoadId||0)+1;
  const view=quotaModelView();
  if(!options.silent) panel.innerHTML=`<div class="oauth-panel"><div class="oauth-panel-head"><div class="grow"><h3 class="oauth-panel-title">额度拟合 · Quota Model</h3><p class="oauth-panel-copy">正在读取额度快照与 CPA token 记录并拟合…</p></div></div></div>`;
  try{
    const data=await api("/quota-model?window="+(view.window==="all"?"all":"recent")+"&cycles="+view.cycles+(options.force?"&fresh=1":""));
    if(!panel.isConnected||panel._qmLoadId!==loadId||page!=="subs") return;
    panel.innerHTML=quotaModelHTML(data,view);
    const refresh=panel.querySelector("[data-qm-refresh]");
    if(refresh) refresh.onclick=()=>loadQuotaModel(panel,{force:true});
    panel.querySelectorAll("[data-qm-view]").forEach(btn=>{btn.onclick=()=>{localStorage.setItem("cpa-quota-model-view",btn.getAttribute("data-qm-view"));loadQuotaModel(panel,{force:true});};});
    const toggle=panel.querySelector("[data-qm-points]");
    if(toggle) toggle.onclick=()=>{
      const boxes=Array.from(panel.querySelectorAll(".qm-points"));
      const collapsed=boxes.length?boxes[0].classList.contains("qm-collapsed"):false;
      boxes.forEach(box=>box.classList.toggle("qm-collapsed",!collapsed));
      toggle.textContent=collapsed?"隐藏观测明细":"显示观测明细";
    };
    if(data.computing) setTimeout(()=>{if(page==="subs"&&panel.isConnected) loadQuotaModel(panel,{silent:true});},2500);
  }catch(e){
    if(!panel.isConnected||panel._qmLoadId!==loadId||page!=="subs") return;
    panel.innerHTML=`<div class="oauth-panel-error">额度拟合读取失败：${esc(e.message)}</div>`;
  }
}

function renderKeyList(keys){

    <div class="datagrid-row key-cols key-item" data-key="${esc(k.id)}">
      <span class="row-main">
        <span class="kname row-title">${esc(k.name)}</span>
        <span class="row-sub">创建于 ${dateStr(k.createdAt)} · ${timeAgo(k.lastUsedAt)}${k.note?" · "+esc(k.note):""}</span>

      <span class="state"><i class="dot ${k.enabled?(k.expiresAt?"warn":"on"):""}"></i>${k.enabled?(k.expiresAt?new Date(k.expiresAt*1000).toLocaleDateString("zh-CN")+" 到期":"生效中"):"已停用"}</span>
      <button class="switch ${k.enabled?"on":""}" data-role="toggle"></button>
      <button class="icon-btn danger" data-role="delete" title="撤销" aria-label="撤销密钥"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>`).join("") || `<div class="empty">尚未签发下游 API Key。</div>`;
  el.querySelectorAll("[data-key]").forEach(row=>{
    const k=keys.find(x=>x.id===row.dataset.key); if(!k) return;
    row.querySelector('[data-role="toggle"]').onclick=async e=>{
      e.currentTarget.classList.toggle("on");
      try{ await api("/keys/"+encodeURIComponent(k.id),{method:"PATCH",body:JSON.stringify({enabled:e.currentTarget.classList.contains("on")})}); toast("Key 已"+(e.currentTarget.classList.contains("on")?"启用":"停用")); }catch(err){ e.currentTarget.classList.toggle("on"); toast(err.message,"err"); }
    };
    row.querySelector('[data-role="delete"]').onclick=async()=>{
      if(!confirm("确认撤销该 Key？撤销后立即失效。")) return;
      try{ await api("/keys/"+encodeURIComponent(k.id),{method:"DELETE"}); delete revealedKeys[k.id]; toast("Key 已撤销"); renderKeys(); }catch(err){ toast(err.message,"err"); }
    };
  });
}

function localDateTimeValue(ts){
  const d=new Date(Number(ts)*1000), off=d.getTimezoneOffset();
  return new Date(d.getTime()-off*60000).toISOString().slice(0,16);
}
function usageWindow(){
  const now=Math.floor(Date.now()/1000);
  if(usageFilters.preset==="custom"){
    const start=usageFilters.start?Math.floor(new Date(usageFilters.start).getTime()/1000):null;
    const end=usageFilters.end?Math.floor(new Date(usageFilters.end).getTime()/1000):now;
    return {start,end};
  }
  if(usageFilters.preset==="today"){
    const d=new Date(); d.setHours(0,0,0,0);
    return {start:Math.floor(d.getTime()/1000),end:now};
  }
  const days={"1d":1,"7d":7,"14d":14,"30d":30}[usageFilters.preset]||14;
  return {start:now-days*86400,end:now};
}
function usageWindowLabel(w){
  if(usageFilters.preset==="custom") return `${usageFilters.start||"—"} 至 ${usageFilters.end||"现在"}`;
  const labels={today:"今天", "1d":"近 1 天", "7d":"近 7 天", "14d":"近 14 天", "30d":"近 30 天"};
  return labels[usageFilters.preset]||labels["14d"];
}
function usageQuery(){
  const w=usageWindow();
  if(!Number.isFinite(w.start)||!Number.isFinite(w.end)||w.end<=w.start) throw new Error("时间范围无效：结束时间必须晚于开始时间");
  const q=new URLSearchParams({start:String(w.start),end:String(w.end),bucket:String(usageFilters.bucket),limit:"200"});
  if(usageFilters.model) q.set("model",usageFilters.model);
  return q.toString();
}
function renderUsageModelOptions(models){
  const select=$("#usageModelFilter"); if(!select) return;
  const current=usageFilters.model;
  const values=[...new Set([...(models||[]),...Object.keys(usagePrices||{})])].filter(Boolean).sort((a,b)=>a.localeCompare(b));
  select.innerHTML=`<option value="">全部模型</option>`+values.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join("");
  select.value=current;
  if(select.value!==current) usageFilters.model="";
}
function bindUsageControls(){
  $("#usageModelFilter").onchange=e=>{ usageFilters.model=e.target.value; saveUsageFilters(); refreshUsage(); };
  $("#usageRange").onchange=e=>{
    usageFilters.preset=e.target.value;
    if(usageFilters.preset==="custom" && !usageFilters.start){ const w=usageWindow(); usageFilters.start=localDateTimeValue(w.start); usageFilters.end=localDateTimeValue(w.end); }
    $("#usageCustom").style.display=usageFilters.preset==="custom"?"grid":"none"; saveUsageFilters(); refreshUsage();
  };
  $("#usageStart").onchange=e=>{ usageFilters.start=e.target.value; saveUsageFilters(); if(usageFilters.preset==="custom") refreshUsage(); };
  $("#usageEnd").onchange=e=>{ usageFilters.end=e.target.value; saveUsageFilters(); if(usageFilters.preset==="custom") refreshUsage(); };
  $("#usageBucket").onchange=e=>{ usageFilters.bucket=Number(e.target.value)||1800; saveUsageFilters(); refreshUsage(); };
  $("#usageRefresh").onchange=e=>{ usageFilters.refreshMs=Number(e.target.value)||10000; saveUsageFilters(); refreshUsage(); };
  $("#usageRefreshNow").onclick=()=>refreshUsage();
  $("#usageRange").value=usageFilters.preset; $("#usageRefresh").value=String(usageFilters.refreshMs); $("#usageBucket").value=String(usageFilters.bucket);
  $("#usageCustom").style.display=usageFilters.preset==="custom"?"grid":"none";
  if(usageFilters.start) $("#usageStart").value=usageFilters.start;
  if(usageFilters.end) $("#usageEnd").value=usageFilters.end;
}

async function refreshUsage(){
  if(usageLoading) return; usageLoading=true;
  try{
    const u=await api("/usage?"+usageQuery());
    if(page!=="usage") return;
    usageModels=u.models||[]; usagePrices=u.prices||{};
    renderUsageModelOptions(usageModels);
    const t=u.totals||{};
    const cards=[
      ["请求",fmt(t.requests),"当前筛选范围"],["未缓存输入",fmtShort(t.input),"缓存命中 "+fmtShort(t.cached)],["缓存命中",fmtShort(t.cached),"当前筛选范围"],["输出",fmtShort(t.output),t.output_tps?("平均 "+fmtTps(t.output_tps)):"尚无吞吐数据"],["平均首字",t.ttft_ms?fmtDuration(t.ttft_ms):"—","当前筛选范围"],["缓存率",t.cache_pct!=null?t.cache_pct+"%":"—","缓存命中 /（缓存命中 + 未缓存输入）"],["成本",fmtCost(t.cost),"按已设置的模型价格"]
    ];
    $("#usageToday").innerHTML=cards.map(([title,value,sub])=>`<div class="stat"><span class="stat-label">${esc(title)}</span><span class="stat-value">${esc(value)}</span><span class="stat-sub">${esc(sub)}</span></div>`).join("");
    const total=Math.max(1,Number(t.input||0)+Number(t.output||0)+Number(t.cached||0));
    const parts=[["未缓存输入",t.input||0,"var(--series-input)"],["输出",t.output||0,"var(--series-output)"],["缓存命中",t.cached||0,"var(--series-cached)"],["缓存写入",t.write||0,"var(--series-write)"]].filter(x=>x[1]>0);
    $("#todayBar").innerHTML=`<div class="cbar">${parts.map(([n,v,c])=>`<span style="width:${(v/total*100).toFixed(2)}%;background:${c}" title="${n}: ${fmt(v)}"></span>`).join("")}</div><div class="cbar-legend">${parts.map(([n,v,c])=>`<em><i style="background:${c}"></i>${n} <b>${fmtShort(v)}</b></em>`).join("")}</div>`;
    const formatPoint=s=>({label:new Date(Number(s.ts)*1000).toLocaleString("zh-CN",{hour12:false,month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}),ts:s.ts,requests:s.requests,input:Math.max(0,Number(s.input)||0),output:Math.max(0,Number(s.output)||0),cached:Math.max(0,Number(s.cached)||0),write:Math.max(0,Number(s.write)||0),cost:Math.max(0,Number(s.cost)||0),output_tps:Math.max(0,Number(s.output_tps)||0)});
    const points=(u.byBucket||[]).map(formatPoint);
    const fallback=Object.entries(u.byDay||{}).sort((a,b)=>a[0].localeCompare(b[0])).map(([d,v])=>formatPoint({ts:new Date(d+"T00:00:00Z").getTime()/1000,...v}));
    const chartPoints=(points.length?points:fallback).sort((a,b)=>Number(a.ts)-Number(b.ts));
    $("#usageFilterSummary").textContent=`${usageFilters.model||"全部模型"} · ${usageWindowLabel(usageWindow())} · ${chartPoints.length} 个真实时间采样点 · 更新于 ${fmtClock(u.updatedAt)}`;
    $("#trendDesc").textContent=`${usageWindowLabel(usageWindow())} · 每 ${usageFilters.bucket/60} 分钟采样 · 按真实时间轴显示，空桶按 0 计 · 费用使用右侧坐标轴`;
    renderAreaChart($("#chart14"),chartPoints,{uid:"usage-range",height:340});
    const models=Object.entries(u.byModel||{}).sort((a,b)=>(Number(b[1].input||0)+Number(b[1].cached||0)+Number(b[1].output||0))-(Number(a[1].input||0)+Number(a[1].cached||0)+Number(a[1].output||0)));
    $("#modelTbl").innerHTML=`<thead><tr><th>模型</th><th class="r">请求</th><th class="r">未缓存输入</th><th class="r">缓存命中</th><th class="r">输出</th><th class="r">成本</th><th class="r">平均速度</th></tr></thead><tbody>${models.map(([m,v])=>`<tr><td class="mono">${esc(m)}</td><td class="r">${fmt(v.requests)}</td><td class="r">${fmtShort(v.input)}</td><td class="r">${fmtShort(v.cached)}</td><td class="r">${fmtShort(v.output)}</td><td class="r">${fmtCost(v.cost)}</td><td class="r">${fmtTps(v.output_tps)}</td></tr>`).join("")||`<tr><td colspan="7" class="muted">暂无数据</td></tr>`}</tbody>`;
    const recent=u.recent||[];
    $("#recentTbl").innerHTML=`<thead><tr><th>时间</th><th>模型</th><th>Key</th><th class="r">未缓存输入</th><th class="r">缓存</th><th class="r">输出</th><th class="r">总 Token</th><th class="r">成本</th><th class="r">时长</th><th class="r">首字</th><th class="r">速度</th></tr></thead><tbody>${recent.map(c=>`<tr><td class="mono">${fmtClock(c.ts)}</td><td class="mono">${recentModelCell(c)}</td><td class="mono" title="${esc(c.key_id||"")}">${esc(shortKey(c.key_id))}</td><td class="r">${fmt(c.input)}</td><td class="r">${fmt(c.cached)}</td><td class="r">${fmt(c.output)}</td><td class="r">${fmt(c.total)}</td><td class="r">${fmtCost(c.cost)}</td><td class="r">${fmtDuration(c.duration_ms)}</td><td class="r">${c.ttft_ms?fmtDuration(c.ttft_ms):"—"}</td><td class="r">${fmtTps(c.output_tps)}</td></tr>`).join("")||`<tr><td colspan="11" class="muted">暂无调用记录</td></tr>`}</tbody>`;
  }catch(e){ if(page==="usage") toast(e.message,"err"); }
  finally{
    usageLoading=false;
    clearTimeout(usageTimer);
    usageTimer=setTimeout(()=>{ if(page==="usage") refreshUsage(); }, usageFilters.refreshMs);
  }
}

// Web semantics and focus behavior for dynamic CPA views.
let dialogReturnFocus=null;
let uiFieldId=0;
const enhanceDynamicUI=()=>{
  document.querySelectorAll(".form-label").forEach(label=>{
    const input=label.nextElementSibling;
    if(input && /^(INPUT|SELECT|TEXTAREA)$/.test(input.tagName)){
      if(!input.id) input.id="cpa-field-"+(++uiFieldId);
      label.htmlFor=input.id;
    }
  });
  document.querySelectorAll("button.switch").forEach(button=>{
    button.type="button";
    button.setAttribute("role","switch");
    button.setAttribute("aria-checked",String(button.classList.contains("on")));
    const context=button.closest(".key-item");
    button.setAttribute("aria-label",button.title || (context?"启用密钥 "+(context.querySelector(".kname")?.textContent||""):"启用"));
  });
  document.querySelectorAll(".mapping-row").forEach(row=>{
    row.querySelectorAll("input,select").forEach((el,i)=>el.setAttribute("aria-label",["下游请求名称","上游模型名称","上下文窗口","思考档位"][i]||"模型设置"));
  });
  document.querySelectorAll(".price-row").forEach(row=>{
    row.querySelectorAll("input").forEach((el,i)=>el.setAttribute("aria-label",["未缓存输入价格","缓存命中价格","输出价格"][i]));
  });
  document.querySelectorAll("table th").forEach(th=>{if(!th.hasAttribute("scope")) th.scope="col";});
};
const uiObserver=new MutationObserver(enhanceDynamicUI);
uiObserver.observe(document.body,{childList:true,subtree:true});
enhanceDynamicUI();

const dialogObserver=new MutationObserver(()=>{
  const sheet=$("#sheet");
  if(sheet.classList.contains("on")){
    if(!$("#app").inert){
      dialogReturnFocus=document.activeElement;
      $("#app").inert=true;
      sheet.setAttribute("aria-label",sheet.querySelector("h3")?.textContent||"设置");
      (sheet.querySelector("input,select,textarea,button")||sheet).focus();
    }
  }else if($("#app").inert){
    $("#app").inert=false;
    if(dialogReturnFocus?.isConnected) dialogReturnFocus.focus();
  }
});
dialogObserver.observe($("#sheet"),{attributes:true,attributeFilter:["class"]});

document.addEventListener("keydown",event=>{
  const sheet=$("#sheet");
  if(!sheet.classList.contains("on")) return;
  if(event.key==="Escape"){event.preventDefault();closeSheet();return;}
  if(event.key==="Tab"){
    const items=[...sheet.querySelectorAll("button,input,select,textarea,a[href],[tabindex]")].filter(el=>!el.disabled&&el.tabIndex!==-1&&el.getClientRects().length);
    if(!items.length){event.preventDefault();sheet.focus();return;}
    const first=items[0],last=items[items.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
});

document.addEventListener("click",event=>{
  const button=event.target.closest("button.switch");
  if(button) setTimeout(()=>button.setAttribute("aria-checked",String(button.classList.contains("on"))),0);
});
